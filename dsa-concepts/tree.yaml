# DSA Concepts (2026) - build tree  [rev 2]
# Root for every path below: dsa-concepts/
# Nothing outside dsa-concepts/ is touched by any unit in this tree.

vision: >
  A non-technical reader opens one self-contained HTML file and ends up able to look at any
  problem, recognise its shape, and name the structure and approach it wants. The course is
  roughly seventy percent visual: every idea arrives as a real-life scene, then a whiteboard
  animation the reader can play and step through, then an architecture or flow diagram of how
  it actually works, then the real systems that run on it, and then the disguised forms the
  problem takes in the wild along with a worked solution. No diagram is ever cluttered,
  overlapped or cramped, because every diagram is laid out on a grid by a deterministic engine
  and checked for collisions at build time. No code is required to finish the course.

principles:
  - Seventy percent visual is a measured rule, not a vibe. check_lesson.py enforces it.
  - Nothing overlaps. check_layout.py recomputes every box and asserts zero intersections.
  - Animations live on a whiteboard surface. One idea per frame, generous whitespace.
  - Every chapter must contain the full required diagram inventory across its lessons.
  - Every lesson answers six questions in order: what, how, how many types, what it costs,
    where it really lives, and how its problems show up disguised.
  - Plain language before notation. Big O only after the reader has felt the cost.
  - Chapter files stay declarative. Diagrams and animations are JSON, never inline script.
  - No em-dashes, no invented facts, no filler lesson.
  - ai-pm-2026 and build-live-products-2026 are read-only references.

palette:
  surface: white content page, dark royal green rail
  green: ["#04211a", "#062e24", "#0a4234", "#0d5a45", "#12785d", "#19a077", "#eef7f3"]
  gold:  ["#f0b429", "#cf9109", "#fdf6e3"]
  ink:   ["#0f1a16", "#43524c", "#7e8b86"]
  state: {idle: grey, checking: gold, ruled_out: faded grey, found: green, trap: amber, wrong: red}

lesson_blocks:
  - 1.  The Everyday Situation        # scene visual, zero jargon
  - 2.  What It Actually Is           # plain definition + one still diagram
  - 3.  Watch It Work                 # whiteboard animation, steppable. The heart.
  - 4.  Under The Hood                # sequence or state diagram of the real mechanism
  - 5.  The Types                     # comparison table + decision tree + small figures
  - 6.  What It Costs In Plain English # curve, felt first, notation second
  - 7.  Where It Lives In Real Life   # architecture / network diagram of real systems
  - 8.  How Problems Show Up          # disguised phrasings -> signal -> structure. The dots.
  - 9.  Solve It Live                 # one real problem worked end to end, swimlane of thinking
  - 10. Your Turn                     # non-code rep + Check Yourself quizzes
  # every lesson ends with the literal token __NAV__

required_diagram_inventory:      # every CHAPTER must contain at least one of each
  - architecture
  - flowchart
  - sequence
  - state
  - erd
  - decision-tree
  - table
  - user-flow
  - journey-map
  - swimlane
  - component
  - network
  - information-architecture
  - knowledge-graph
  - wireframe
  - intelligence-card
  - whiteboard-animation

curriculum:
  chapters:
    - ["00", "Start Here", 2]
    - ["01", "What a Data Structure Actually Is", 4]
    - ["02", "The Cost of Doing Things", 4]
    - ["03", "Arrays: The Row of Boxes", 5]
    - ["04", "Linked Lists: The Chain", 5]
    - ["05", "Stacks and Queues: Who Gets Served First", 4]
    - ["06", "Searching: Finding One Thing", 8]     # reference chapter, built first
    - ["07", "Sorting: Putting Things in Order", 7]
    - ["08", "Hashing: Finding Without Looking", 5]
    - ["09", "Trees: Things That Branch", 5]
    - ["10", "Binary Search Trees and Staying Balanced", 5]
    - ["11", "Heaps and Priority Queues: Who Is Most Urgent", 4]
    - ["12", "Graphs: Things Connected to Things", 5]
    - ["13", "Getting Around a Graph: Traversal and Shortest Path", 6]
    - ["14", "Recursion and Divide and Conquer", 5]
    - ["15", "The Three Styles: Greedy, Dynamic Programming, Backtracking", 6]
    - ["16", "Strings and Pattern Matching", 5]
    - ["17", "Modern Structures: Tries, Bloom Filters, LRU, Union-Find, Vector Indexes", 6]
    - ["18", "The Method: Reading a Problem You Have Never Seen", 4]
    - ["19", "The Real-World Lab: 10 Systems Torn Down", 10]
  totals: {chapters: 20, lessons: 105}

chapter_06_plan:
  through_line: >
    Search is the price you pay for order you did not keep. Every search method is one trade:
    how much structure you maintain up front, against how fast you find later. Decide the
    structure first and the algorithm picks itself.
  lessons:
    - ["6.1", "What Searching Really Is, and the One Question That Decides Everything"]
    - ["6.2", "Linear Search: Check Every Box"]
    - ["6.3", "Binary Search: Halve the Haystack"]
    - ["6.4", "The Search Family: Jump, Exponential, Interpolation, Ternary"]
    - ["6.5", "Searching Structured Data: Trees, Tries and Database Indexes"]
    - ["6.6", "Searching by Meaning: Vector Search, ANN and RAG"]
    - ["6.7", "How Search Problems Show Up: Reading the Disguise"]
    - ["6.8", "Choose Your Search: The Decision Flowchart and 6 Systems Torn Down"]

milestones:

  - id: M1
    name: Course skeleton
    ships: python3 build.py turns sources into dsa-concepts-master.html, which opens and navigates
    categories:
      - id: M1.C1
        name: Contracts
        layers:
          - layer: contract
            levels:
              - level: 0
                units:
                  - id: M1.C1.L-contract.V0.U01
                    what: course_map.json, 20 chapters, 105 lesson ids and titles, one through_line each
                    artifact: course_map.json
                    verify: python3 -c "import json;d=json.load(open('course_map.json'));assert len(d['chapters'])==20;assert sum(len(c['lessons']) for c in d['chapters'])==105;assert all(c['through_line'] for c in d['chapters']);print('ok')"
                    depends_on: []
                  - id: M1.C1.L-contract.V0.U02
                    what: CONSISTENCY.md, the single authoring bible. Replaces the three separate docs
                      originally planned here (VISUAL_SPEC, CONCEPTS, BUILD_GUIDE), because splitting
                      them across three files is how they drift out of agreement.
                    artifact: CONSISTENCY.md
                    verify: python3 -c "s=open('CONSISTENCY.md').read(); assert s.count(chr(10)+'## ')>=14; assert chr(8212) not in s; print('ok')"
                    depends_on: [M1.C1.L-contract.V0.U01]
                    note: retires M1.C1.L-contract.V0.U03 and M1.C1.L-contract.V0.U04, ids not reused
      - id: M1.C2
        name: Builder
        layers:
          - layer: logic
            levels:
              - level: 0
                units:
                  - id: M1.C2.L-logic.V0.U01
                    what: build.py stitches map plus chapters into the master and derives live or soon
                    artifact: build.py
                    verify: python3 build.py && test -s dsa-concepts-master.html
                    depends_on: [M1.C1.L-contract.V0.U01]
              - level: 1
                units:
                  - id: M1.C2.L-logic.V1.U01
                    what: build.py parses every data-viz payload, fails loudly on bad JSON or unknown type
                    artifact: build.py
                    verify: python3 build.py 2>&1 | grep -q 'viz blocks ok'
                    depends_on: [M1.C2.L-logic.V0.U01, M2.C1.L-contract.V0.U01]
      - id: M1.C3
        name: Shell and reader
        layers:
          - layer: interface
            levels:
              - level: 0
                units:
                  - id: M1.C3.L-interface.V0.U01
                    what: design tokens, dark royal green rail on a white content page, gold second accent
                    artifact: shell.html
                    verify: python3 -c "s=open('shell.html').read();[__import__('sys').exit('missing '+t) for t in ['--green-900','--gold-500','--paper:#ffffff'] if t not in s];print('ok')"
                    depends_on: []
                  - id: M1.C3.L-interface.V0.U02
                    what: rail plus reading column layout, mobile drawer, progress bar
                    artifact: shell.html
                    verify: grep -q 'id="rail"' shell.html && grep -q 'id="view"' shell.html
                    depends_on: [M1.C3.L-interface.V0.U01]
                  - id: M1.C3.L-interface.V0.U03
                    what: reader engine, buildNav, load, __NAV__ replacement, quiz binding
                    artifact: shell.html
                    verify: python3 -c "s=open('shell.html').read();[__import__('sys').exit('missing '+f) for f in ['function load(','__NAV__','function bindQuiz'] if f not in s];print('ok')"
                    depends_on: [M1.C3.L-interface.V0.U02]
              - level: 1
                units:
                  - id: M1.C3.L-interface.V1.U01
                    what: lesson component CSS, ten block headers, callouts, tables, quiz, whiteboard surface
                    artifact: shell.html
                    verify: python3 -c "s=open('shell.html').read();[__import__('sys').exit('missing '+c) for c in ['.les-title','.motto','.callout','.quiz','.board','.viz'] if c not in s];print('ok')"
                    depends_on: [M1.C3.L-interface.V0.U03]
      - id: M1.C4
        name: Verification harness
        layers:
          - layer: integration
            levels:
              - level: 0
                units:
                  - id: M1.C4.L-integration.V0.U01
                    what: check_js.sh, node --check on the master script plus backtick parity
                    artifact: verify/check_js.sh
                    verify: bash verify/check_js.sh
                    depends_on: [M1.C2.L-logic.V0.U01]
                  - id: M1.C4.L-integration.V0.U02
                    what: check_viz.py, every data-viz is valid JSON of a registered type with required fields
                    artifact: verify/check_viz.py
                    verify: python3 verify/check_viz.py
                    depends_on: [M1.C2.L-logic.V0.U01, M1.C1.L-contract.V0.U02]
                  - id: M1.C4.L-integration.V0.U03
                    what: check_layout.py, recomputes every diagram box and asserts zero overlaps and no overflow
                    artifact: verify/check_layout.py
                    verify: python3 verify/check_layout.py
                    depends_on: [M1.C4.L-integration.V0.U02, M2.C2.L-integration.V0.U01]
                  - id: M1.C4.L-integration.V0.U04
                    what: check_lesson.py, ten blocks present, visual budget met, __NAV__ present
                    artifact: verify/check_lesson.py
                    verify: python3 verify/check_lesson.py
                    depends_on: [M1.C2.L-logic.V0.U01]
                  - id: M1.C4.L-integration.V0.U05
                    what: check_chapter.py, the required diagram inventory is fully covered by each live chapter
                    artifact: verify/check_chapter.py
                    verify: python3 verify/check_chapter.py
                    depends_on: [M1.C4.L-integration.V0.U02]
                  - id: M1.C4.L-integration.V0.U06
                    what: check_style.py, no em-dash, no stray backtick, no dollar-brace interpolation
                    artifact: verify/check_style.py
                    verify: python3 verify/check_style.py
                    depends_on: [M1.C2.L-logic.V0.U01]
                  - id: M1.C4.L-integration.V0.U07
                    what: qa.sh runs the whole harness in order, non-zero on first failure, no skips
                    artifact: verify/qa.sh
                    verify: bash verify/qa.sh
                    depends_on:
                      - M1.C4.L-integration.V0.U01
                      - M1.C4.L-integration.V0.U02
                      - M1.C4.L-integration.V0.U03
                      - M1.C4.L-integration.V0.U04
                      - M1.C4.L-integration.V0.U05
                      - M1.C4.L-integration.V0.U06

