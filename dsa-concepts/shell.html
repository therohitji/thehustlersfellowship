VIZ['arch']      = function(s){ return renderLayered(s, {name:'architecture', shape:'box', kind:'box'}); };
VIZ['component'] = function(s){ return renderLayered(s, {name:'component diagram', shape:'box', kind:'muted'}); };
VIZ['seq']       = renderSeq;
VIZ['swim']      = renderSwim;
VIZ['journey']   = renderJourney;
VIZ['net']       = renderNet;
VIZ['kgraph']    = renderNet;
VIZ['erd']       = renderErd;
VIZ['wire']      = renderWire;
VIZ['card']      = renderCard;
VIZ['curve']     = renderCurve;
VIZ['scene']     = renderScene;

const VIZ_KIND = {
  flow:'Flowchart', dtree:'Decision tree', state:'State diagram', uflow:'User flow',
  ia:'Information architecture', arch:'Architecture diagram', component:'Component diagram',
  seq:'Sequence diagram', swim:'Swimlane diagram', journey:'Journey map', net:'Network diagram',
  kgraph:'Knowledge graph', erd:'Entity relationship diagram', wire:'Screen wireframe',
  card:'Intelligence card', curve:'Growth chart', scene:'Real life'
};

function mountViz(root){
  (root || document).querySelectorAll('.viz[data-viz]').forEach(function(el){
    if (el.dataset.mounted) return;
    let spec;
    try { spec = JSON.parse(el.getAttribute('data-viz')); }
    catch (err) { el.innerHTML = '<div class="viz-cap">diagram payload is not valid JSON</div>'; return; }
    const fn = VIZ[spec.type];
    if (!fn){ el.innerHTML = '<div class="viz-cap">unknown diagram type: ' + esc(spec.type) + '</div>'; return; }
    let body = '';
    try { body = fn(spec); }
    catch (err) { body = '<div class="viz-cap">layout error: ' + esc(err.message) + '</div>'; }
    const legend = (spec.legend || []).map(function(l){
      return '<span><i style="background:' + ((KIND[l[1]] || KIND.box).fill) + ';border:1.4px solid ' + ((KIND[l[1]] || KIND.box).stroke) + '"></i>' + esc(l[0]) + '</span>';
    }).join('');
    el.innerHTML =
      '<div class="viz-head"><div class="viz-kind">' + esc(VIZ_KIND[spec.type] || spec.type) + '</div>' +
      (spec.title ? '<div class="viz-title">' + esc(spec.title) + '</div>' : '') + '</div>' +
      '<div class="viz-body">' + body + '</div>' +
      (legend ? '<div class="viz-legend">' + legend + '</div>' : '') +
      (spec.caption ? '<div class="viz-cap">' + esc(spec.caption) + '</div>' : '');
    el.dataset.mounted = '1';
  });
}

/* ============================ ANIMATION ENGINE ============================ */
/* A renderer builds the SVG once, then paints each frame by mutating attributes.
   Rebuilding innerHTML per frame would kill the CSS transitions, so we never do that. */

const ST = {
  idle:  {fill:'#ffffff', stroke:CLR.lineS, text:CLR.soft,  op:1},
  range: {fill:CLR.grey0, stroke:CLR.lineS, text:CLR.soft,  op:1},
  look:  {fill:CLR.gold0, stroke:CLR.gold,  text:CLR.gold6, op:1},
  dead:  {fill:'#ffffff', stroke:CLR.line,  text:CLR.mute,  op:.34},
  found: {fill:CLR.g050,  stroke:CLR.g600,  text:CLR.g700,  op:1},
  seen:  {fill:CLR.g050,  stroke:CLR.g500,  text:CLR.g700,  op:1},
  bad:   {fill:CLR.bad0,   stroke:CLR.bad,   text:CLR.bad,   op:1}
};
/* the id-keyed twin of stateOf, for renderers whose cells are named rather than indexed.
   same precedence, minus the range window, which only means anything on a row. */
function stateOfId(step, id){
  if ((step.bad   || []).indexOf(id) > -1) return 'bad';
  if ((step.found || []).indexOf(id) > -1) return 'found';
  if ((step.look  || []).indexOf(id) > -1) return 'look';
  if ((step.seen  || []).indexOf(id) > -1) return 'seen';
  if ((step.dead  || []).indexOf(id) > -1) return 'dead';
  return 'idle';
}
function stateOf(step, i){
  if ((step.bad   || []).indexOf(i) > -1) return 'bad';
  if ((step.found || []).indexOf(i) > -1) return 'found';
  if ((step.look  || []).indexOf(i) > -1) return 'look';
  if ((step.seen  || []).indexOf(i) > -1) return 'seen';
  if ((step.dead  || []).indexOf(i) > -1) return 'dead';
  if (step.range && (i < step.range[0] || i > step.range[1])) return 'dead';
  if (step.range) return 'range';
  return 'idle';
}
function paintCell(g, st){
  const s = ST[st] || ST.idle;
  const r = g.querySelector('rect');
  if (r){ r.setAttribute('fill', s.fill); r.setAttribute('stroke', s.stroke); }
  g.setAttribute('opacity', s.op);
  g.querySelectorAll('text').forEach(function(t){ t.setAttribute('fill', s.text); });
  g.classList.remove('look','found');
  if (st === 'look' || st === 'found'){ void g.offsetWidth; g.classList.add(st); }
}

const ANIM = {};

/* ---- array-scan: the workhorse for every linear and halving search ---- */
ANIM['array-scan'] = function(spec){
  const data = spec.data || [];
  const K = spec.big ? 1.4 : 1;
  const fs = Math.round(14 * K), cellH = Math.round(52 * K), gap = Math.round(9 * K);
  const maxLen = Math.max.apply(null, data.map(function(d){ return String(d).length; }).concat([2]));
  const cellW = Math.max(Math.round(46 * K), Math.ceil(maxLen * charW(fs)) + Math.round(22 * K));
  const idxH = Math.round(20 * K), ptrH = spec.pointers === false ? 0 : Math.round(42 * K);
  const w = Math.max(data.length, spec.capacity || 0) * (cellW + gap) - gap;
  const top = 26, h = top + cellH + idxH + ptrH + 26;
  let s = '';
  if (spec.target != null){
    s += labelAt(0, 10, 'looking for ' + spec.target, 12, CLR.g700, 'start', 700);
  }
  /* spare capacity beyond the data, drawn as empty dashed slots so a doubling has somewhere
     visible to go. spec.capacity is the total number of slots, data.length of them filled. */
  const cap = Math.max(data.length, spec.capacity || data.length);
  for (let i = data.length; i < cap; i++){
    const x = i * (cellW + gap);
    s += '<g class="slot" data-i="' + i + '" opacity="0" style="transition:opacity .3s">' +
      '<rect x="' + x + '" y="' + top + '" width="' + cellW + '" height="' + cellH + '" rx="9" fill="none" stroke="' + CLR.line + '" stroke-width="1.4" stroke-dasharray="5 4"/></g>';
  }
  data.forEach(function(d, i){
    const x = i * (cellW + gap);
    s += '<g class="cell" data-i="' + i + '" opacity="1" style="transition:transform .45s ease-out,opacity .28s">' +
         '<rect x="' + x + '" y="' + top + '" width="' + cellW + '" height="' + cellH + '" rx="9" fill="#ffffff" stroke="' + CLR.lineS + '" stroke-width="1.5"/>' +
         '<text x="' + (x + cellW/2) + '" y="' + (top + cellH/2) + '" text-anchor="middle" dominant-baseline="central" font-family="' + MONO + '" font-size="' + fs + '" font-weight="500" fill="' + CLR.soft + '">' + esc(d) + '</text></g>' +
         labelAt(x + cellW/2, top + cellH + 12, (spec.labels && spec.labels[i] != null) ? spec.labels[i] : i, 9.5, CLR.mute, 'middle', 600);
  });
  if (ptrH){
    /* the four pointer slots can be renamed per board. A queue wants front and back, a stack
       wants top, and calling them lo and hi in those lessons would be teaching the renderer
       rather than the structure. */
    const PL = spec.pointerLabels || {};
    ['lo','mid','hi','i'].forEach(function(p){
      const col = p === 'mid' ? CLR.gold6 : p === 'i' ? CLR.gold6 : CLR.g700;
      s += '<g class="ptr" data-p="' + p + '" opacity="0" style="transition:opacity .2s,transform .3s">' +
           '<path d="M0,' + (top + cellH + idxH + 6) + ' l-5,9 h10 Z" fill="' + col + '"/>' +
           labelAt(0, top + cellH + idxH + 25, PL[p] || p, 10, col, 'middle', 700) + '</g>';
    });
  }
  s += '<g class="counter">' + labelAt(w, 10, '', 12, CLR.gold6, 'end', 700) + '</g>';
  s += '<g class="abadge" opacity="0" style="transition:opacity .3s">' +
       '<rect x="0" y="' + (top + cellH + idxH + ptrH - 4) + '" width="196" height="24" rx="8" fill="#ffffff" stroke="' + CLR.lineS + '"/>' +
       '<text x="98" y="' + (top + cellH + idxH + ptrH + 8) + '" text-anchor="middle" dominant-baseline="central" font-family="' + FONT + '" font-size="11.5" font-weight="700" fill="' + CLR.g700 + '"></text></g>';
  return {
    svg: frame(s, w, h),
    apply: function(root, step){
      root.querySelectorAll('.cell').forEach(function(g){
        const i = +g.dataset.i;
        paintCell(g, stateOf(step, i));
        /* the shuffle: everything from index shift.from moves right by shift.by places */
        const sh = step.shift;
        g.setAttribute('transform', (sh && i >= sh.from)
          ? 'translate(' + ((sh.by == null ? 1 : sh.by) * (cellW + gap)) + ',0)' : 'translate(0,0)');
      });
      root.querySelectorAll('.slot').forEach(function(g){
        g.setAttribute('opacity', step.capacity && +g.dataset.i < step.capacity ? '1' : '0');
      });
      /* two pointers on the same box would print on top of each other, so they fan out */
      const at = {};
      ['lo','mid','hi','i'].forEach(function(p){
        const v = step.ptr ? step.ptr[p] : null;
        if (v == null || v < 0 || v >= data.length) return;
        (at[v] = at[v] || []).push(p);
      });
      const nudge = {};
      Object.keys(at).forEach(function(v){
        const grp = at[v];
        grp.forEach(function(p, k){ nudge[p] = (k - (grp.length - 1)/2) * Math.round(30 * K); });
      });
      root.querySelectorAll('.ptr').forEach(function(g){
        const p = g.dataset.p, v = step.ptr ? step.ptr[p] : null;
        if (v == null || v < 0 || v >= data.length){ g.setAttribute('opacity', '0'); return; }
        g.setAttribute('opacity', '1');
        g.setAttribute('transform', 'translate(' + (v * (cellW + gap) + cellW/2 + (nudge[p] || 0)) + ',0)');
      });
      const c = root.querySelector('.counter text');
      if (c) c.textContent = step.count != null ? (step.count + (spec.countLabel || ' checks')) : '';
      const ab = root.querySelector('.abadge');
      if (ab){
        ab.setAttribute('opacity', step.badge ? '1' : '0');
        const at = ab.querySelector('text'); if (at) at.textContent = step.badge || '';
      }
    }
  };
};

/* ---- race: several methods on the same data, live step counters ---- */
ANIM['race'] = function(spec){
  const tracks = spec.tracks || [];
  const n = (tracks[0] && tracks[0].data ? tracks[0].data.length : 0);
  const fs = 12.5, cellH = 36, gap = 6, laneGap = 30;
  /* The lane label column has to be as wide as the longest lane name, or a descriptive
     label runs straight into the first cell. */
  const labelW = Math.max(128, Math.ceil(Math.max.apply(null,
    tracks.map(function(t){ return String(t.label || '').length * charW(12); }).concat([0]))) + 18);
  /* Long tracks used to run past the edge of the reel stage. The cell shrinks to fit a
     sensible canvas instead, down to a floor where the digits are still legible. */
  /* the counter is right anchored at the canvas edge, so the right margin has to be as wide as
     the longest counter string a step can produce, not a fixed guess */
  const unitTxt = tracks.map(function(t){ return t.countLabel || spec.countLabel || ' checks'; });
  const widestCount = Math.ceil(Math.max.apply(null, (spec.steps || []).map(function(st){
    return Math.max.apply(null, (st.lanes || []).map(function(ln, li){
      return ln && ln.count != null ? String(ln.count).length + (unitTxt[li] || '').length : 0;
    }).concat([0]));
  }).concat([8])) * charW(12) + 22);
  const rightM = Math.max(96, widestCount);
  const room = 1000 - labelW - rightM;
  const cellW = Math.max(22, Math.min(40, Math.floor((room - (n - 1) * gap) / Math.max(1, n))));
  const w = labelW + n * cellW + (n - 1) * gap + rightM;
  const h = tracks.length * (cellH + laneGap);
  let s = '';
  tracks.forEach(function(t, ti){
    const y = ti * (cellH + laneGap);
    s += labelAt(0, y + cellH/2, t.label, 12, CLR.g700, 'start', 700);
    (t.data || []).forEach(function(d, i){
      const x = labelW + i * (cellW + gap);
      s += '<g class="cell" data-t="' + ti + '" data-i="' + i + '" opacity="1">' +
           '<rect x="' + x + '" y="' + y + '" width="' + cellW + '" height="' + cellH + '" rx="7" fill="#ffffff" stroke="' + CLR.lineS + '" stroke-width="1.4"/>' +
           '<text x="' + (x + cellW/2) + '" y="' + (y + cellH/2) + '" text-anchor="middle" dominant-baseline="central" font-family="' + MONO + '" font-size="' + fs + '" fill="' + CLR.soft + '">' + esc(d) + '</text></g>';
    });
    s += '<g class="tcount" data-t="' + ti + '">' + labelAt(w, y + cellH/2, '', 12, CLR.gold6, 'end', 700) + '</g>';
  });
  s += '<g class="rbadge" opacity="0" style="transition:opacity .3s">' +
       '<rect x="' + labelW + '" y="' + (-26) + '" width="164" height="24" rx="8" fill="#ffffff" stroke="' + CLR.lineS + '"/>' +
       '<text x="' + (labelW + 82) + '" y="' + (-14) + '" text-anchor="middle" dominant-baseline="central" font-family="' + FONT + '" font-size="11.5" font-weight="700" fill="' + CLR.g700 + '"></text></g>';
  const units = tracks.map(function(t){ return t.countLabel || spec.countLabel || ' checks'; });
  return {
    svg: frameFit(s, [{x:labelW, y:-30, w:164, h:30}], w, h),
    apply: function(root, step){
      const lanes = step.lanes || [];
      root.querySelectorAll('.cell').forEach(function(g){
        const t = +g.dataset.t, i = +g.dataset.i;
        paintCell(g, lanes[t] ? stateOf(lanes[t], i) : 'idle');
      });
      root.querySelectorAll('.tcount text').forEach(function(t, ti){
        t.textContent = lanes[ti] && lanes[ti].count != null ? lanes[ti].count + units[ti] : '';
      });
      const rb = root.querySelector('.rbadge');
      if (rb){
        rb.setAttribute('opacity', step.badge ? '1' : '0');
        const bt = rb.querySelector('text'); if (bt) bt.textContent = step.badge || '';
      }
    }
  };
};

/* ---- tree-walk: binary tree / trie / BST search ---- */
ANIM['tree-walk'] = function(spec){
  const nodes = spec.nodes || [];
  const r = 24, levelH = 82, unit = spec.unit || 62;
  const xs = nodes.map(function(n){ return n.x * unit; });
  const w = Math.max.apply(null, xs) + r*2, h = Math.max.apply(null, nodes.map(function(n){ return n.d; })) * levelH + r*2 + 8;
  const pos = {}; nodes.forEach(function(n){ pos[n.id] = { cx:n.x*unit + r, cy:n.d*levelH + r + 4 }; });
  let s = '';
  (spec.edges || []).forEach(function(e){
    const a = pos[e.from], b = pos[e.to];
    if (!a || !b) return;
    s += '<line x1="' + a.cx + '" y1="' + (a.cy + r) + '" x2="' + b.cx + '" y2="' + (b.cy - r) + '" stroke="' + CLR.line + '" stroke-width="1.6"/>';
    /* a trie is unreadable without the character on the branch, so e.w rides the edge. It sits
       on the OUTSIDE of the branch rather than on the line, because a tree edge is close to
       vertical and a label centred on it would be struck through by its own edge. */
    if (e.w != null){
      const mx = a.cx + (b.cx - a.cx) * 0.45;
      const my = (a.cy + r) + ((b.cy - r) - (a.cy + r)) * 0.45;
      const off = b.cx === a.cx ? -12 : (b.cx > a.cx ? 12 : -12);
      s += labelAt(mx + off, my, e.w, 11, CLR.gold6, 'middle', 700);
    }
  });
  nodes.forEach(function(n){
    const p = pos[n.id];
    s += '<g class="cell" data-i="' + n.id + '" opacity="1">' +
         '<rect x="' + (p.cx - r) + '" y="' + (p.cy - r) + '" width="' + (r*2) + '" height="' + (r*2) + '" rx="' + r + '" fill="#ffffff" stroke="' + CLR.lineS + '" stroke-width="1.6"/>' +
         '<text x="' + p.cx + '" y="' + p.cy + '" text-anchor="middle" dominant-baseline="central" font-family="' + MONO + '" font-size="13" fill="' + CLR.soft + '">' + esc(n.label) + '</text></g>';
  });
  return {
    svg: frame(s, w, h),
    apply: function(root, step){
      root.querySelectorAll('.cell').forEach(function(g){
        const id = g.dataset.i;
        paintCell(g, stateOfId(step, id));
      });
    }
  };
};

/* ---- graph-walk ---- */
ANIM['graph-walk'] = function(spec){
  const nodes = spec.nodes || [], unit = spec.unit || 108, r = 26;
  const pos = {}; nodes.forEach(function(n){ pos[n.id] = { cx:n.x*unit + r, cy:n.y*unit + r }; });
  const w = Math.max.apply(null, nodes.map(function(n){ return pos[n.id].cx + r; }));
  const h = Math.max.apply(null, nodes.map(function(n){ return pos[n.id].cy + r; })) + 30;
  let s = '';
  (spec.edges || []).forEach(function(e){
    const a = pos[e.from], b = pos[e.to];
    if (!a || !b) return;
    const dx = b.cx-a.cx, dy = b.cy-a.cy, d = Math.sqrt(dx*dx+dy*dy) || 1;
    /* Arrowheads are opt in. A chain is directed and the direction is the entire lesson, but the
       same renderer also draws handshakes and group chats where an arrow would be a lie. */
    const dir = e.directed != null ? e.directed : !!spec.directed;
    const gap = dir ? 9 : 0;
    s += '<line class="ge" data-e="' + e.from + '-' + e.to + '" x1="' + (a.cx + dx/d*r) + '" y1="' + (a.cy + dy/d*r) +
         '" x2="' + (b.cx - dx/d*(r + gap)) + '" y2="' + (b.cy - dy/d*(r + gap)) + '" stroke="' + CLR.line + '" stroke-width="1.8" ' +
         (dir ? 'marker-end="url(#ah)" ' : '') + 'style="transition:stroke .3s"/>';
    if (e.w != null) s += labelAt((a.cx+b.cx)/2, (a.cy+b.cy)/2 - 9, e.w, 10.5, CLR.mute, 'middle', 700);
  });
  nodes.forEach(function(n){
    const p = pos[n.id];
    s += '<g class="cell" data-i="' + n.id + '" opacity="1">' +
         '<rect x="' + (p.cx-r) + '" y="' + (p.cy-r) + '" width="' + (r*2) + '" height="' + (r*2) + '" rx="' + r + '" fill="#ffffff" stroke="' + CLR.lineS + '" stroke-width="1.6"/>' +
         '<text x="' + p.cx + '" y="' + p.cy + '" text-anchor="middle" dominant-baseline="central" font-family="' + FONT + '" font-size="12.5" font-weight="600" fill="' + CLR.soft + '">' + esc(n.label) + '</text></g>';
  });
  /* a marker under each node, so two travelling pointers can be told apart by name rather than
     by colour alone. Declared for every node and revealed per step, like everything else here. */
  nodes.forEach(function(n){
    const p = pos[n.id];
    s += '<g class="mark" data-i="' + n.id + '" opacity="0" style="transition:opacity .25s">' +
      '<rect x="' + (p.cx - 30) + '" y="' + (p.cy + r + 6) + '" width="60" height="20" rx="6" fill="#ffffff" stroke="' + CLR.gold + '" stroke-width="1.3"/>' +
      '<text x="' + p.cx + '" y="' + (p.cy + r + 16) + '" text-anchor="middle" dominant-baseline="central" font-family="' + FONT + '" font-size="10.5" font-weight="700" fill="' + CLR.gold6 + '"></text></g>';
  });
  return {
    svg: frame(s, w, h),
    apply: function(root, step){
      root.querySelectorAll('.cell').forEach(function(g){
        const id = g.dataset.i;
        paintCell(g, stateOfId(step, id));
      });
      root.querySelectorAll('.ge').forEach(function(l){
        const live = (step.edges || []).indexOf(l.dataset.e) > -1;
        l.setAttribute('stroke', live ? CLR.g600 : CLR.line);
        /* an edge that is not live is not merely pale, it does not exist yet, which is what
           makes a rewire legible: the old arrow goes and the new one appears */
        l.setAttribute('opacity', (step.edges && !live) ? '0.12' : '1');
      });
      const tags = step.tags || {};
      root.querySelectorAll('.mark').forEach(function(g){
        const t = tags[g.dataset.i];
        g.setAttribute('opacity', t ? '1' : '0');
        const tx = g.querySelector('text'); if (tx) tx.textContent = t || '';
      });
    }
  };
};

/* ---- vector: semantic space, query point, expanding neighbourhood ---- */
ANIM['vector'] = function(spec){
  const pts = spec.points || [], w = spec.width || 520, h = spec.height || 300, unit = spec.unit || 1;
  const q = spec.query;

  /* labels place themselves: try above, below, right, then left, and take the first slot that
     collides with nothing already on the board. A dense cluster is the whole point of this
     picture, so the captions have to get out of each others way on their own. */
  const taken = pts.map(function(p){ return { x:p.x*unit - 9, y:p.y*unit - 9, w:18, h:18 }; });
  if (q) taken.push({ x:q.x*unit - 12, y:q.y*unit - 12, w:24, h:24 });
  function slot(cx, cy, txt, fs){
    const lw = String(txt).length * charW(fs) + 12, lh = Math.round(fs * 1.7);
    const cands = [[cx, cy - 19], [cx, cy + 21], [cx + lw/2 + 15, cy], [cx - lw/2 - 15, cy],
                   [cx, cy - 36], [cx, cy + 38]];
    for (const c of cands){
      const r = { x:c[0] - lw/2, y:c[1] - lh/2, w:lw, h:lh };
      if (r.x < -PAD || r.x + r.w > w + PAD) continue;
      if (!taken.some(function(t){ return rectsHit(r, t); })){ taken.push(r); return c; }
    }
    taken.push({ x:cx - lw/2, y:cy - 19 - lh/2, w:lw, h:lh });
    return [cx, cy - 19];
  }

  let s = '<rect x="0" y="0" width="' + w + '" height="' + h + '" rx="12" fill="' + CLR.grey0 + '" opacity=".45"/>';
  s += '<circle class="halo" cx="0" cy="0" r="0" fill="' + CLR.gold + '" opacity="0.14" style="transition:r .5s,cx .3s,cy .3s"/>';

  /* the query owns the best slot, then the points closest to it, then the rest */
  let qlab = '';
  if (q){
    const c = slot(q.x*unit, q.y*unit, q.label || 'your question', 11.5);
    qlab = '<g class="qpt"><path d="M' + q.x*unit + ',' + (q.y*unit - 10) + ' l10,10 l-10,10 l-10,-10 Z" fill="' + CLR.g700 + '"/>' +
      chip(c[0], c[1], q.label || 'your question', 11.5, CLR.g700, 700) + '</g>';
  }
  const order = pts.map(function(p, i){ return i; }).sort(function(a, b){
    if (!q) return a - b;
    const da = Math.hypot(pts[a].x - q.x, pts[a].y - q.y), db = Math.hypot(pts[b].x - q.x, pts[b].y - q.y);
    return da - db;
  });
  const cells = [];
  order.forEach(function(i){
    const p = pts[i];
    const c = slot(p.x*unit, p.y*unit, p.label, 10.5);
    cells[i] = '<g class="cell" data-i="' + i + '" opacity="1">' +
      '<rect x="' + (p.x*unit - 7) + '" y="' + (p.y*unit - 7) + '" width="14" height="14" rx="7" fill="#ffffff" stroke="' + CLR.lineS + '" stroke-width="1.6"/>' +
      chip(c[0], c[1], p.label, 10.5, CLR.soft, 600) + '</g>';
  });
  s += cells.join('') + qlab;

  return {
    svg: frame(s, w, h),
    apply: function(root, step){
      root.querySelectorAll('.cell').forEach(function(g){ paintCell(g, stateOf(step, +g.dataset.i)); });
      const halo = root.querySelector('.halo');
      if (halo && q){
        halo.setAttribute('cx', q.x*unit); halo.setAttribute('cy', q.y*unit);
        halo.setAttribute('r', step.radius != null ? step.radius*unit : 0);
      }
    }
  };
};


/* ---- curve: the cost lines drawing themselves, so scale is felt not claimed ---- */
ANIM['curve'] = function(spec){
  const w = spec.width || 620, h = spec.height || 300, ml = 58, mb = 40, mt = 18, mr = 120;
  const px = w - ml - mr, py = h - mt - mb, N = spec.n || 40;
  const FN = {
    '1':     function(){ return 1; },
    'logn':  function(n){ return Math.log2(n + 1); },
    'sqrtn': function(n){ return Math.sqrt(n); },
    'n':     function(n){ return n; },
    'nlogn': function(n){ return n * Math.log2(n + 1); },
    'n2':    function(n){ return n * n; },
    'n3':    function(n){ return n * n * n; },
    '2n':    function(n){ return Math.pow(2, Math.min(n, 60)); },
    'nfact': function(n){ let v = 1; for (let k = 2; k <= Math.min(n, 20); k++) v *= k; return v; }
  };
  const series = (spec.series || []).map(function(sr){
    const f = FN[sr.fn] || FN.n, pts = [];
    for (let i = 1; i <= N; i++) pts.push([i, f(i)]);
    return { label:sr.label, label2:sr.label2, pts:pts,
      color: sr.color === 'gold' ? CLR.gold6 : sr.color === 'bad' ? CLR.bad : sr.color === 'green' ? CLR.g600 : CLR.grey };
  });
  const maxY = Math.max.apply(null, series.map(function(sr){ return sr.pts[sr.pts.length-1][1]; })) || 1;
  /* On a linear axis, putting O(1) and O(2 to the n) on one chart flattens five of the seven
     shapes onto the floor. A log axis is the only way the family is legible together, so it is
     opt in per chart and always announced on the axis label. */
  const LOG = !!spec.logScale;
  const frac = function(v){ return LOG ? Math.log10(Math.max(1, v)) / Math.log10(Math.max(10, maxY))
                                       : Math.min(1, v / maxY); };
  let s = '<line x1="' + ml + '" y1="' + mt + '" x2="' + ml + '" y2="' + (mt+py) + '" stroke="' + CLR.lineS + '" stroke-width="1.3"/>' +
          '<line x1="' + ml + '" y1="' + (mt+py) + '" x2="' + (ml+px) + '" y2="' + (mt+py) + '" stroke="' + CLR.lineS + '" stroke-width="1.3"/>' +
          labelAt(ml + px/2, mt + py + 26, spec.xlabel || 'how much data', 11.5, CLR.mute, 'middle', 600) +
          '<g transform="translate(18,' + (mt + py/2) + ') rotate(-90)">' +
            labelAt(0, 0, (spec.ylabel || 'looks it takes') + (LOG ? ', log scale' : ''), 11.5, CLR.mute, 'middle', 600) + '</g>';
  series.forEach(function(sr, i){
    const d = sr.pts.map(function(p, k){
      const x = ml + (p[0]/N) * px, y = mt + py - frac(p[1]) * py;
      return (k ? 'L' : 'M') + x.toFixed(1) + ',' + y.toFixed(1);
    }).join(' ');
    const last = sr.pts[sr.pts.length-1];
    const ly = Math.max(mt + 8, mt + py - frac(last[1]) * py);
    s += '<g class="cline" data-s="' + i + '" opacity="0" style="transition:opacity .3s">' +
      '<path d="' + d + '" fill="none" stroke="' + sr.color + '" stroke-width="2.6" stroke-linecap="round" ' +
      'pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" style="transition:stroke-dashoffset .55s ease-out"/>' +
      labelAt(ml + px + 10, ly, sr.label, 11.5, sr.color, 'start', 700) +
      (sr.label2 ? '<g class="cnote" opacity="0" style="transition:opacity .3s">' +
        labelAt(ml + px + 10, ly + 15, sr.label2, 10.5, sr.color, 'start', 600) + '</g>' : '') + '</g>';
  });
  s += '<g class="cbadge" opacity="0" style="transition:opacity .3s">' +
       '<rect x="' + (ml + 12) + '" y="' + (mt + 10) + '" width="150" height="26" rx="8" fill="#ffffff" stroke="' + CLR.lineS + '"/>' +
       '<text x="' + (ml + 87) + '" y="' + (mt + 23) + '" text-anchor="middle" dominant-baseline="central" font-family="' + FONT + '" font-size="12" font-weight="700" fill="' + CLR.g700 + '"></text></g>';
  return {
    svg: frame(s, w, h),
    apply: function(root, step){
      const show = step.show || series.map(function(_, i){ return i; });
      root.querySelectorAll('.cline').forEach(function(g){
        const i = +g.dataset.s, on = show.indexOf(i) > -1;
        g.setAttribute('opacity', on ? '1' : '0');
        const p = g.querySelector('path');
        if (p) p.setAttribute('stroke-dashoffset', on ? String(100 - (step.pct == null ? 100 : step.pct)) : '100');
        g.querySelectorAll('.cnote').forEach(function(nt){ nt.setAttribute('opacity', (on && step.notation) ? '1' : '0'); });
      });
      const b = root.querySelector('.cbadge');
      if (b){
        b.setAttribute('opacity', step.badge ? '1' : '0');
        const t = b.querySelector('text'); if (t) t.textContent = step.badge || '';
      }
    }
  };
};

/* ---- reveal: a flowchart, architecture or decision tree that draws itself ---- */
ANIM['reveal'] = function(spec){
  const vs = Object.assign({}, spec.viz || {});
  const preset = { name: 'reveal', shape: vs.shape || 'box', kind: vs.kind || 'box', addressable: true };
  return {
    svg: renderLayered(vs, preset),
    apply: function(root, step){
      const show = step.show || [];
      root.querySelectorAll('.cell').forEach(function(g){
        const id = g.dataset.i;
        if (show.indexOf(id) < 0){ g.setAttribute('opacity', '0'); return; }
        paintCell(g, stateOfId(step, id));
      });
      root.querySelectorAll('.ge').forEach(function(g){
        const ends = String(g.dataset.e).split('-');
        const live = step.edges ? step.edges.indexOf(g.dataset.e) > -1
                                : (show.indexOf(ends[0]) > -1 && show.indexOf(ends[1]) > -1);
        g.setAttribute('opacity', live ? '1' : '0');
      });
    }
  };
};


/* ---- grid: a 2D array, and the one long row it actually is underneath ----
   Set flatRow true and the same cells are drawn a second time in memory order below the grid,
   so the reader watches row times width plus column being computed rather than being told it.
   Cells are addressed as [row, col] in every state list. */
ANIM['grid'] = function(spec){
  const rows = spec.rows || 4, cols = spec.cols || 6;
  const cw = spec.cellW || 46, ch = spec.cellH || 38, gap = 6;
  const flat = !!spec.flatRow;
  const labW = (spec.rowLabels ? 66 : 0);
  const gridW = cols * cw + (cols - 1) * gap;
  const fcw = flat ? Math.max(20, Math.min(cw, Math.floor((gridW - (rows*cols - 1) * 3) / (rows*cols)))) : cw;
  const fgap = 3;
  const gridH = rows * ch + (rows - 1) * gap;
  const headH = spec.colLabels ? 20 : 0;
  const flatH = flat ? 74 : 0;
  /* the flat row is usually wider than the grid it came from, so the canvas takes the wider
     of the two rather than clipping whichever one lost */
  const flatW = flat ? (rows*cols) * (fcw + fgap) - fgap : 0;
  const w = labW + Math.max(gridW, flatW), h = headH + gridH + flatH + 20;
  const val = function(r, c){
    if (spec.data && spec.data[r] && spec.data[r][c] != null) return spec.data[r][c];
    return r * cols + c;
  };
  let s = '';
  if (spec.colLabels) spec.colLabels.forEach(function(t, c){
    s += labelAt(labW + c*(cw+gap) + cw/2, 8, t, 10, CLR.mute, 'middle', 700);
  });
  for (let r = 0; r < rows; r++){
    if (spec.rowLabels) s += labelAt(labW - 12, headH + r*(ch+gap) + ch/2, spec.rowLabels[r] || ('row ' + r), 10, CLR.mute, 'end', 700);
    for (let c = 0; c < cols; c++){
      const x = labW + c*(cw+gap), y = headH + r*(ch+gap);
      s += '<g class="cell" data-i="' + r + ',' + c + '" opacity="1">' +
        '<rect x="' + x + '" y="' + y + '" width="' + cw + '" height="' + ch + '" rx="7" fill="#ffffff" stroke="' + CLR.lineS + '" stroke-width="1.4"/>' +
        '<text x="' + (x+cw/2) + '" y="' + (y+ch/2) + '" text-anchor="middle" dominant-baseline="central" font-family="' + MONO + '" font-size="12" fill="' + CLR.soft + '">' + esc(val(r,c)) + '</text></g>';
    }
  }
  if (flat){
    const fy = headH + gridH + 34;
    s += labelAt(labW, fy - 14, spec.flatLabel || 'the same cells, as memory actually holds them', 10.5, CLR.mute, 'start', 600);
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++){
      const k = r*cols + c, x = labW + k*(fcw+fgap);
      s += '<g class="fcell" data-i="' + r + ',' + c + '" opacity="1">' +
        '<rect x="' + x + '" y="' + fy + '" width="' + fcw + '" height="26" rx="5" fill="#ffffff" stroke="' + CLR.line + '" stroke-width="1.2"/></g>';
    }
  }
  s += '<g class="gbadge" opacity="0" style="transition:opacity .3s">' +
       '<rect x="' + labW + '" y="' + (h - 12) + '" width="230" height="24" rx="8" fill="#ffffff" stroke="' + CLR.lineS + '"/>' +
       '<text x="' + (labW + 115) + '" y="' + h + '" text-anchor="middle" dominant-baseline="central" font-family="' + FONT + '" font-size="11.5" font-weight="700" fill="' + CLR.g700 + '"></text></g>';

  const has = function(list, r, c){
    return (list || []).some(function(p){ return p[0] === r && p[1] === c; });
  };
  return {
    svg: frameFit(s, [{x:labW, y:h-12, w:230, h:24}], w, h),
    apply: function(root, step){
      const paint = function(g){
        const p = String(g.dataset.i).split(','), r = +p[0], c = +p[1];
        let st = 'idle';
        if (has(step.bad, r, c)) st = 'bad';
        else if (has(step.found, r, c)) st = 'found';
        else if (has(step.look, r, c)) st = 'look';
        else if (has(step.seen, r, c)) st = 'seen';
        else if (has(step.dead, r, c)) st = 'dead';
        else if (step.row != null && r === step.row) st = 'range';
        else if (step.col != null && c === step.col) st = 'range';
        paintCell(g, st);
      };
      root.querySelectorAll('.cell').forEach(paint);
      root.querySelectorAll('.fcell').forEach(paint);
      const b = root.querySelector('.gbadge');
      if (b){
        b.setAttribute('opacity', step.badge ? '1' : '0');
        const t = b.querySelector('text'); if (t) t.textContent = step.badge || '';
      }
    }
  };
};

/* ---- player ---- */
const BOARDS = [];
const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function animPaint(b){
  const step = b.spec.steps[b.i] || {};
  b.impl.apply(b.canvas, step);
  b.cap.innerHTML = step.say ? step.say : '';
  b.dots.querySelectorAll('i').forEach(function(d, k){
    d.className = k < b.i ? 'on' : (k === b.i ? 'now' : '');
  });
  b.stepEl.textContent = (b.i + 1) + ' / ' + b.spec.steps.length;
  b.prevBtn.disabled = b.i === 0;
  b.nextBtn.disabled = b.i === b.spec.steps.length - 1;
}
function animGoto(b, i){
  b.i = Math.max(0, Math.min(b.spec.steps.length - 1, i));
  animPaint(b);
}
function animStep(b, d){ animPause(b); animGoto(b, b.i + d); }
function animReset(b){ animPause(b); animGoto(b, 0); }
function animPause(b){
  if (b.timer){ clearInterval(b.timer); b.timer = null; }
  b.playing = false;
  b.playBtn.textContent = '▶  Play';
}
function animPlay(b){
  if (b.playing){ animPause(b); return; }
  if (b.i >= b.spec.steps.length - 1) b.i = -1;
  b.playing = true;
  b.playBtn.textContent = '❚❚  Pause';
  const tick = function(){
    if (b.i >= b.spec.steps.length - 1){ animPause(b); return; }
    animGoto(b, b.i + 1);
    if (b.i >= b.spec.steps.length - 1) animPause(b);
  };
  tick();
  b.timer = setInterval(tick, Math.max(220, (b.spec.speed || 1150) / b.rate));
}
function animRate(b, r){
  b.rate = r;
  b.rateBtn.textContent = r + 'x';
  if (b.playing){ animPause(b); animPlay(b); }
}

function mountAnims(root){
  BOARDS.splice(0).forEach(function(b){ if (b.timer) clearInterval(b.timer); });
  (root || document).querySelectorAll('.board[data-anim]').forEach(function(el){
    let spec;
    try { spec = JSON.parse(el.getAttribute('data-anim')); }
    catch (err){ el.innerHTML = '<div class="viz-cap">animation payload is not valid JSON</div>'; return; }
    const make = ANIM[spec.type];
    if (!make){ el.innerHTML = '<div class="viz-cap">unknown animation type: ' + esc(spec.type) + '</div>'; return; }
    if (!spec.steps || !spec.steps.length){ el.innerHTML = '<div class="viz-cap">animation has no steps</div>'; return; }
    const impl = make(spec);
    const legend = (spec.legend || []).map(function(l){
      const s = ST[l[1]] || ST.idle;
      return '<span><i style="background:' + s.fill + ';border:1.4px solid ' + s.stroke + ';opacity:' + s.op + '"></i>' + esc(l[0]) + '</span>';
    }).join('');
    el.innerHTML =
      '<div class="board-head"><div><div class="bk">Whiteboard</div>' +
        (spec.title ? '<div class="bt">' + esc(spec.title) + '</div>' : '') + '</div></div>' +
      '<div class="board-canvas"><div class="board-grid"></div>' + impl.svg + '</div>' +
      '<div class="anim-caption"></div>' +
      (legend ? '<div class="viz-legend" style="padding:12px 22px 0">' + legend + '</div>' : '') +
      '<div class="anim-bar">' +
        '<button class="anim-btn primary js-play">▶  Play</button>' +
        '<button class="anim-btn js-prev" title="one step back">◀</button>' +
        '<button class="anim-btn js-next" title="one step forward">▶</button>' +
        '<button class="anim-btn js-reset" title="start over">↺</button>' +
        '<button class="anim-btn js-rate" title="speed">1x</button>' +
        '<span class="anim-step"></span>' +
        '<span class="anim-dots">' + spec.steps.map(function(){ return '<i></i>'; }).join('') + '</span>' +
      '</div>' +
      (spec.caption ? '<div class="viz-cap" style="padding:4px 22px 18px">' + esc(spec.caption) + '</div>' : '');

    const b = {
      el:el, spec:spec, impl:impl, i:0, rate:1, playing:false, timer:null,
      canvas:el.querySelector('.board-canvas'),
      cap:el.querySelector('.anim-caption'),
      dots:el.querySelector('.anim-dots'),
      stepEl:el.querySelector('.anim-step'),
      playBtn:el.querySelector('.js-play'),
      prevBtn:el.querySelector('.js-prev'),
      nextBtn:el.querySelector('.js-next'),
      rateBtn:el.querySelector('.js-rate')
    };
    b.playBtn.onclick = function(){ animPlay(b); };
    b.prevBtn.onclick = function(){ animStep(b, -1); };
    b.nextBtn.onclick = function(){ animStep(b, 1); };
    el.querySelector('.js-reset').onclick = function(){ animReset(b); };
    b.rateBtn.onclick = function(){ animRate(b, b.rate === 1 ? 2 : b.rate === 2 ? 0.5 : 1); };
    b.dots.querySelectorAll('i').forEach(function(d, k){ d.onclick = function(){ animPause(b); animGoto(b, k); }; });
    animPaint(b);
    BOARDS.push(b);

    if (!REDUCED && 'IntersectionObserver' in window){
      const io = new IntersectionObserver(function(entries){
        entries.forEach(function(en){
          if (en.isIntersecting && !b.playing && b.i === 0 && !b.autoDone){ b.autoDone = true; animPlay(b); }
          else if (!en.isIntersecting && b.playing) animPause(b);
        });
      }, { threshold: 0.45 });
      io.observe(el);
    }
  });
}


/* ============================ REEL: the chapter whiteboard ============================ */
/* A reel is a sequence of acts. Each act is a full animation spec, so every renderer above
   works inside it unchanged. Play runs an act to its end and then walks straight into the
   next one, which is what makes it feel like one continuous explanation rather than a
   folder of separate widgets. */
const REELS = [];

function reelPaint(r){
  const act = r.spec.acts[r.act];
  const step = act.steps[r.i] || {};
  r.impl.apply(r.stage, step);
  r.cap.innerHTML = step.say || '';
  r.stepEl.textContent = 'act ' + (r.act + 1) + ' of ' + r.spec.acts.length + '  ·  step ' + (r.i + 1) + ' / ' + act.steps.length;
  r.dots.querySelectorAll('i').forEach(function(d, k){ d.className = k < r.i ? 'on' : (k === r.i ? 'now' : ''); });
  r.tabs.forEach(function(t, k){ t.className = k === r.act ? 'on' : (k < r.act ? 'done' : ''); });
  r.prevBtn.disabled = (r.act === 0 && r.i === 0);
  r.nextBtn.disabled = (r.act === r.spec.acts.length - 1 && r.i === act.steps.length - 1);
}
function reelLoadAct(r, k, atEnd){
  r.act = Math.max(0, Math.min(r.spec.acts.length - 1, k));
  const act = r.spec.acts[r.act];
  r.impl = ANIM[act.type](act);
  r.stage.innerHTML = '<div class="board-grid"></div>' + r.impl.svg;
  r.title.textContent = act.title || '';
  r.dots.innerHTML = act.steps.map(function(){ return '<i></i>'; }).join('');
  r.dots.querySelectorAll('i').forEach(function(d, j){ d.onclick = function(){ reelPause(r); r.i = j; reelPaint(r); }; });
  const lg = (act.legend || r.spec.legend || []);
  r.legend.innerHTML = lg.map(function(l){
    const st = ST[l[1]] || ST.idle;
    return '<span><i style="background:' + st.fill + ';border:1.4px solid ' + st.stroke + ';opacity:' + st.op + '"></i>' + esc(l[0]) + '</span>';
  }).join('');
  r.i = atEnd ? act.steps.length - 1 : 0;
  reelPaint(r);
}
function reelPause(r){
  if (r.timer){ clearInterval(r.timer); r.timer = null; }
  r.playing = false;
  r.playBtn.textContent = '▶  Play the whole thing';
}
function reelStep(r, d){
  reelPause(r);
  const act = r.spec.acts[r.act];
  if (d > 0){
    if (r.i < act.steps.length - 1){ r.i++; reelPaint(r); }
    else if (r.act < r.spec.acts.length - 1) reelLoadAct(r, r.act + 1, false);
  } else {
    if (r.i > 0){ r.i--; reelPaint(r); }
    else if (r.act > 0) reelLoadAct(r, r.act - 1, true);
  }
}
function reelPlay(r){
  if (r.playing){ reelPause(r); return; }
  r.playing = true;
  r.playBtn.textContent = '❚❚  Pause';
  const tick = function(){
    const act = r.spec.acts[r.act];
    if (r.i < act.steps.length - 1){ r.i++; reelPaint(r); return; }
    if (r.act < r.spec.acts.length - 1){ reelLoadAct(r, r.act + 1, false); return; }
    reelPause(r);
  };
  const last = r.spec.acts[r.spec.acts.length - 1];
  if (r.act === r.spec.acts.length - 1 && r.i >= last.steps.length - 1) reelLoadAct(r, 0, false);
  r.timer = setInterval(tick, Math.max(240, (r.spec.speed || 1500) / r.rate));
}

function mountReels(root){
  REELS.splice(0).forEach(function(r){ if (r.timer) clearInterval(r.timer); });
  (root || document).querySelectorAll('.reel[data-reel]').forEach(function(el){
    let spec;
    try { spec = JSON.parse(el.getAttribute('data-reel')); }
    catch (err){ el.innerHTML = '<div class="viz-cap">reel payload is not valid JSON</div>'; return; }
    const acts = (spec.acts || []).filter(function(a){ return ANIM[a.type] && a.steps && a.steps.length; });
    if (!acts.length){ el.innerHTML = '<div class="viz-cap">reel has no playable acts</div>'; return; }
    spec.acts = acts;
    el.innerHTML =
      '<div class="reel-head"><div class="rk">Whiteboard · the whole chapter</div>' +
        (spec.title ? '<div class="rt">' + esc(spec.title) + '</div>' : '') + '</div>' +
      '<div class="reel-acts">' + acts.map(function(a, k){
        const head = (a.part && (k === 0 || acts[k-1].part !== a.part))
          ? '<div class="reel-part">' + esc(a.part) + '</div>' : '';
        return head + '<button data-k="' + k + '">' + (k + 1) + '. ' + esc(a.tab || a.title || ('Act ' + (k+1))) + '</button>';
      }).join('') + '</div>' +
      '<div class="reel-act-title"></div>' +
      '<div class="reel-stage"></div>' +
      '<div class="anim-caption"></div>' +
      '<div class="viz-legend"></div>' +
      '<div class="anim-bar">' +
        '<button class="anim-btn primary js-play">▶  Play the whole thing</button>' +
        '<button class="anim-btn js-prev" title="one step back">◀</button>' +
        '<button class="anim-btn js-next" title="one step forward">▶</button>' +
        '<button class="anim-btn js-reset" title="start over">↺</button>' +
        '<button class="anim-btn js-rate" title="speed">1x</button>' +
        '<span class="anim-step"></span>' +
        '<span class="anim-dots"></span>' +
      '</div>' +
      (spec.caption ? '<div class="viz-cap" style="padding:2px 26px 20px">' + esc(spec.caption) + '</div>' : '');

    const r = {
      el:el, spec:spec, act:0, i:0, rate:1, playing:false, timer:null,
      stage:el.querySelector('.reel-stage'),
      title:el.querySelector('.reel-act-title'),
      cap:el.querySelector('.anim-caption'),
      legend:el.querySelector('.viz-legend'),
      dots:el.querySelector('.anim-dots'),
      stepEl:el.querySelector('.anim-step'),
      playBtn:el.querySelector('.js-play'),
      prevBtn:el.querySelector('.js-prev'),
      nextBtn:el.querySelector('.js-next'),
      rateBtn:el.querySelector('.js-rate'),
      tabs:[].slice.call(el.querySelectorAll('.reel-acts button'))
    };
    r.playBtn.onclick = function(){ reelPlay(r); };
    r.prevBtn.onclick = function(){ reelStep(r, -1); };
    r.nextBtn.onclick = function(){ reelStep(r, 1); };
    el.querySelector('.js-reset').onclick = function(){ reelPause(r); reelLoadAct(r, 0, false); };
    r.rateBtn.onclick = function(){
      r.rate = r.rate === 1 ? 2 : r.rate === 2 ? 0.5 : 1;
      r.rateBtn.textContent = r.rate + 'x';
      if (r.playing){ reelPause(r); reelPlay(r); }
    };
    r.tabs.forEach(function(t, k){ t.onclick = function(){ reelPause(r); reelLoadAct(r, k, false); }; });
    reelLoadAct(r, 0, false);
    REELS.push(r);
  });
}

/* ============================ READER ============================ */
const navEl = document.getElementById('nav');
const ORDER = []; COURSE.forEach(function(c){ c.lessons.forEach(function(l){ ORDER.push([l.id, l.t, l.state]); }); });
let active = "__ACTIVE__";

function nav(prev, next){
  const p = prev ? '<div class="fnav" data-go="' + prev[0] + '"><div class="d">Previous</div><div class="t">← ' + prev[0] + ' · ' + esc(prev[1]) + '</div></div>' : '<div class="fnav ghost"></div>';
  const n = next ? '<div class="fnav next" data-go="' + next[0] + '"><div class="d">Next</div><div class="t">' + next[0] + ' · ' + esc(next[1]) + ' →</div></div>' : '<div class="fnav ghost"></div>';
  return '<div class="footer-nav">' + p + n + '</div>';
}
function navFor(id){
  const i = ORDER.findIndex(function(x){ return x[0] === id; });
  const prev = i > 0 ? ORDER[i-1] : null, next = i < ORDER.length - 1 ? ORDER[i+1] : null;
  return nav(prev ? [prev[0], prev[1]] : null, next ? [next[0], next[1]] : null);
}
function buildNav(){
  navEl.innerHTML = '';
  COURSE.forEach(function(c, ci){
    const chap = document.createElement('div');
    chap.className = 'chap' + (c.open ? ' open' : '');
    let badge = c.done ? '<span class="done">done</span>' : (c.locked ? '<span class="lock">soon</span>' : '');
    chap.innerHTML =
      '<div class="chap-head ' + (c.locked ? 'locked' : '') + '" data-ci="' + ci + '">' +
        '<span class="tw">▶</span><span class="cnum">' + c.n + '</span>' +
        '<span class="ctitle">' + esc(c.title) + '</span>' + badge + '</div>' +
      '<div class="lessons">' + c.lessons.map(function(l){
        return '<div class="les ' + l.state + (l.id === active ? ' active' : '') + '" data-id="' + l.id + '">' +
          '<span class="lnum">' + l.id + '</span><span>' + esc(l.t) + '</span>' +
          '<span class="tag">' + l.state + '</span></div>';
      }).join('') + '</div>';
    navEl.appendChild(chap);
  });
  document.querySelectorAll('.chap-head').forEach(function(h){ h.onclick = function(){ h.parentElement.classList.toggle('open'); }; });
  document.querySelectorAll('.les').forEach(function(l){
    l.onclick = function(){ load(l.dataset.id); if (window.innerWidth <= 1000) closeRail(); };
  });
}
function bindQuiz(){
  document.querySelectorAll('.quiz').forEach(function(q){
    const correct = +q.dataset.correct;
    q.querySelectorAll('.opt').forEach(function(o){
      o.onclick = function(){
        if (q.dataset.done) return;
        q.dataset.done = 1;
        const i = +o.dataset.i;
        if (i === correct) o.classList.add('right');
        else { o.classList.add('wrong'); const r = q.querySelector('[data-i="' + correct + '"]'); if (r) r.classList.add('right'); }
        const e = q.querySelector('.qexp'); if (e) e.classList.add('show');
      };
    });
  });
}
function load(id){
  active = id;
  const view = document.getElementById('view');
  let chapTitle = '', num = '', t = '';
  COURSE.forEach(function(c){ c.lessons.forEach(function(l){ if (l.id === id){ chapTitle = c.title; num = c.n; t = l.t; } }); });
  document.getElementById('crumb').innerHTML = (num === '00') ? '<b>' + esc(chapTitle) + '</b>' : 'Chapter ' + num + ' · <b>' + esc(chapTitle) + '</b>';
  if (LESSONS[id]){
    view.innerHTML = LESSONS[id].replace('__NAV__', navFor(id));
    bindQuiz(); mountViz(view); mountAnims(view); mountReels(view);
  } else {
    const sc = SCOPE[id] || ['This lesson ships in the next drop.'];
    view.innerHTML = '<div class="soon-wrap">' +
      '<div class="big">Lesson ' + id + ' · ships next</div>' +
      '<h2>' + esc(t) + '</h2>' +
      '<p style="color:var(--ink-soft);font-size:19px;">This lesson is not written yet, and it will not ship as filler. Here is exactly what it covers when it drops.</p>' +
      '<div class="scope"><div class="ch">Planned scope</div><ul>' + sc.map(function(s){ return '<li>' + esc(s) + '</li>'; }).join('') + '</ul></div></div>';
  }
  view.querySelectorAll('[data-go]').forEach(function(el){ el.onclick = function(){ load(el.dataset.go); }; });
  document.querySelectorAll('.les').forEach(function(l){ l.classList.toggle('active', l.dataset.id === id); });
  window.scrollTo({ top: 0, behavior: 'instant' });
}
const rail = document.getElementById('rail'), scrim = document.getElementById('scrim');
function closeRail(){ rail.classList.remove('open'); scrim.classList.remove('open'); }
document.getElementById('menuBtn').onclick = function(){ rail.classList.add('open'); scrim.classList.add('open'); };
scrim.onclick = closeRail;

buildNav();
load("__ACTIVE__");
</script>
</body>
