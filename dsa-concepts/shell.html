<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DSA Concepts 2026 - Rohit Swerashi</title>
<meta name="description" content="Data structures and algorithms, made visible. A visual-first course by Rohit Swerashi.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --font-ui:'Hanken Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --font-body:'Hanken Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --font-serif:'Newsreader','Iowan Old Style',Georgia,serif;
    --font-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;

    --paper:#ffffff;
    --paper-soft:#f6f9f7;
    --board:#fbfdfc;

    --green-950:#04211a; --green-900:#062e24; --green-800:#0a4234;
    --green-700:#0d5a45; --green-600:#12785d; --green-500:#19a077;
    --green-050:#eaf5f0;

    --gold-500:#f0b429; --gold-600:#c98a06; --gold-050:#fdf5e0;

    --ink:#0f1a16; --ink-soft:#43524c; --ink-mute:#7e8b86;
    --line:rgba(6,40,32,0.10); --line-strong:rgba(6,40,32,0.20);

    --warn:#b45309; --warn-050:#fff5e9;
    --bad:#b3261e;  --bad-050:#fdf0ef;
    --grey:#9aa5a1; --grey-050:#f1f3f2;

    --rail-w:300px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
  html{scroll-behavior:smooth;}
  body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.65;}

  /* ============================== RAIL ============================== */
  .rail{position:fixed;inset:0 auto 0 0;width:var(--rail-w);overflow-y:auto;z-index:40;
    background:linear-gradient(180deg,var(--green-900) 0%,var(--green-950) 100%);color:#dcece5;
    border-right:1px solid rgba(0,0,0,.3);}
  .rail::-webkit-scrollbar{width:8px;} .rail::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:8px;}
  .rail-brand{padding:26px 22px 18px;border-bottom:1px solid rgba(255,255,255,.09);}
  .rail-brand .kicker{font-size:10.5px;font-weight:700;letter-spacing:.17em;text-transform:uppercase;color:var(--gold-500);}
  .rail-brand h1{font-family:var(--font-ui);font-size:24px;font-weight:800;letter-spacing:-.025em;margin:8px 0 5px;color:#fff;line-height:1.1;}
  .rail-brand .by{font-size:12.5px;color:rgba(220,236,229,.62);font-weight:500;}
  .rail-progress{padding:15px 22px 17px;font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:rgba(220,236,229,.55);border-bottom:1px solid rgba(255,255,255,.09);}
  .pbar{height:5px;border-radius:99px;background:rgba(255,255,255,.13);margin-top:9px;overflow:hidden;}
  .pbar i{display:block;height:100%;width:__PROGRESS__%;background:linear-gradient(90deg,var(--green-500),var(--gold-500));border-radius:99px;}

  .chap{border-bottom:1px solid rgba(255,255,255,.06);}
  .chap-head{display:flex;align-items:center;gap:9px;padding:12px 22px;cursor:pointer;font-size:13.5px;font-weight:600;transition:background .14s;}
  .chap-head:hover{background:rgba(255,255,255,.05);}
  .chap-head .tw{font-size:8px;color:rgba(220,236,229,.4);transition:transform .18s;flex:none;}
  .chap.open .chap-head .tw{transform:rotate(90deg);}
  .chap-head .cnum{font-family:var(--font-mono);font-size:10.5px;color:var(--gold-500);flex:none;}
  .chap-head .ctitle{flex:1;line-height:1.35;color:#eaf5f0;}
  .chap-head.locked .ctitle{color:rgba(220,236,229,.42);}
  .chap-head .lock,.chap-head .done{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:99px;flex:none;}
  .chap-head .lock{color:rgba(220,236,229,.5);background:rgba(255,255,255,.07);}
  .chap-head .done{color:var(--green-950);background:var(--gold-500);}
  .lessons{display:none;padding:2px 0 10px;}
  .chap.open .lessons{display:block;}
  .les{display:flex;align-items:flex-start;gap:9px;padding:8px 22px 8px 40px;font-size:12.5px;line-height:1.45;cursor:pointer;color:rgba(220,236,229,.78);transition:background .14s,color .14s;border-left:2px solid transparent;}
  .les:hover{background:rgba(255,255,255,.05);color:#fff;}
  .les.active{background:rgba(240,180,41,.12);border-left-color:var(--gold-500);color:#fff;font-weight:600;}
  .les.soon{color:rgba(220,236,229,.38);cursor:default;}
  .les.soon:hover{background:none;color:rgba(220,236,229,.38);}
  .les .lnum{font-family:var(--font-mono);font-size:10px;color:rgba(240,180,41,.7);flex:none;padding-top:2px;min-width:26px;}
  .les .tag{margin-left:auto;font-size:8.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:rgba(220,236,229,.35);flex:none;padding-top:2px;}
  .les.active .tag{color:var(--gold-500);}

  .scrim{display:none;position:fixed;inset:0;background:rgba(4,33,26,.5);z-index:35;}
  .scrim.open{display:block;}

  /* ============================== MAIN ============================== */
  .main{margin-left:var(--rail-w);min-height:100vh;}
  .topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:saturate(180%) blur(14px);
    border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 40px;height:52px;}
  .menu-btn{display:none;background:none;border:1px solid var(--line-strong);border-radius:9px;padding:5px 10px;font-size:15px;cursor:pointer;color:var(--ink);}
  .crumb{font-size:12.5px;color:var(--ink-mute);font-weight:500;letter-spacing:.01em;}
  .crumb b{color:var(--ink);font-weight:700;}

  .wrap{max-width:760px;margin:0 auto;padding:54px 40px 150px;}

  /* ---------- lesson header ---------- */
  .les-kicker{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--green-600);}
  .les-title{font-family:var(--font-ui);font-size:43px;font-weight:800;letter-spacing:-.032em;line-height:1.07;margin:13px 0 0;}
  .les-meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:17px;}
  .pill{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:99px;background:var(--green-050);color:var(--green-700);}
  .pill.gold{background:var(--gold-050);color:var(--gold-600);}
  .motto{font-family:var(--font-serif);font-style:italic;font-size:21px;line-height:1.5;color:var(--ink-soft);
    border-left:3px solid var(--gold-500);padding:4px 0 4px 20px;margin:26px 0 0;}
  .lead{font-size:18.5px;line-height:1.62;color:var(--ink-soft);margin-top:22px;}

  /* ---------- block headers ---------- */
  .wrap h2{font-family:var(--font-ui);font-size:26px;font-weight:800;letter-spacing:-.022em;line-height:1.2;
    margin:56px 0 0;display:flex;align-items:center;gap:12px;}
  .wrap h2 .ix{flex:none;width:30px;height:30px;border-radius:9px;background:var(--green-700);color:#fff;
    font-size:14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;letter-spacing:0;}
  .wrap h2 .ix.gold{background:var(--gold-500);color:var(--green-950);}
  .wrap .sub{font-size:15px;color:var(--ink-mute);margin:9px 0 0 42px;font-weight:500;}
  .wrap h3{font-family:var(--font-ui);font-size:19px;font-weight:700;letter-spacing:-.012em;margin:34px 0 0;color:var(--ink);}
  .wrap p{margin-top:16px;color:var(--ink-soft);}
  .wrap p strong{color:var(--ink);font-weight:700;}
  .wrap ul,.wrap ol{margin:16px 0 0 22px;color:var(--ink-soft);}
  .wrap li{margin-top:8px;}
  .wrap em.k{font-style:normal;background:var(--green-050);color:var(--green-700);padding:1px 7px;border-radius:6px;
    font-size:.93em;font-weight:600;}
  .wrap em.g{font-style:normal;background:var(--gold-050);color:var(--gold-600);padding:1px 7px;border-radius:6px;
    font-size:.93em;font-weight:600;}

  /* ---------- callouts ---------- */
  .callout{border:1px solid var(--line);border-left:3px solid var(--green-700);border-radius:12px;
    padding:20px 22px;margin:26px 0 0;background:var(--paper-soft);}
  .callout .ch{font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--green-700);margin-bottom:9px;}
  .callout p{margin-top:0;} .callout p + p{margin-top:12px;}
  .callout.warn{background:var(--warn-050);border-left-color:var(--warn);} .callout.warn .ch{color:var(--warn);}
  .callout.good{background:var(--green-050);border-left-color:var(--green-600);} .callout.good .ch{color:var(--green-700);}
  .callout.accent{background:var(--gold-050);border-left-color:var(--gold-500);} .callout.accent .ch{color:var(--gold-600);}
  .callout.bad{background:var(--bad-050);border-left-color:var(--bad);} .callout.bad .ch{color:var(--bad);}

  /* ---------- tables ---------- */
  .wrap table{width:100%;border-collapse:collapse;margin:26px 0 0;font-size:14.5px;}
  .wrap th{text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    color:var(--ink-mute);padding:0 14px 10px 0;border-bottom:1px solid var(--line-strong);}
  .wrap td{padding:12px 14px 12px 0;border-bottom:1px solid var(--line);color:var(--ink-soft);vertical-align:top;line-height:1.5;}
  .wrap td strong{color:var(--ink);}
  .wrap tr:last-child td{border-bottom:none;}
  .tbl-wrap{overflow-x:auto;margin:26px 0 0;}
  .tbl-wrap table{margin:0;min-width:520px;}
  .tbl-cap{font-size:12.5px;color:var(--ink-mute);margin-top:10px;font-style:italic;}

  /* ---------- flow strip (mono) ---------- */
  .flow{font-family:var(--font-mono);font-size:12px;background:var(--green-950);color:#cfe3da;border-radius:13px;
    padding:22px 24px;margin:26px 0 0;line-height:1.85;overflow-x:auto;}
  .flow .st{color:var(--green-500);font-weight:500;}
  .flow .nt{color:var(--gold-500);}
  .flow .ar{color:rgba(207,227,218,.45);}

  /* ---------- quiz ---------- */
  .quiz{border:1px solid var(--line);border-radius:14px;padding:22px;margin:24px 0 0;background:var(--paper-soft);}
  .quiz .q{font-weight:700;color:var(--ink);font-size:16px;line-height:1.45;}
  .opt{border:1px solid var(--line-strong);border-radius:10px;padding:11px 15px;margin-top:10px;cursor:pointer;
    font-size:14.5px;color:var(--ink-soft);background:#fff;transition:.14s;}
  .opt:hover{border-color:var(--green-600);color:var(--ink);}
  .opt.right{border-color:var(--green-600);background:var(--green-050);color:var(--green-700);font-weight:600;}
  .opt.wrong{border-color:var(--bad);background:var(--bad-050);color:var(--bad);}
  .qexp{display:none;margin-top:14px;font-size:14px;color:var(--ink-soft);border-top:1px dashed var(--line-strong);padding-top:13px;}
  .qexp.show{display:block;}

  /* ---------- footer nav ---------- */
  .footer-nav{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:64px;padding-top:30px;border-top:1px solid var(--line);}
  .fnav{border:1px solid var(--line);border-radius:13px;padding:16px 18px;cursor:pointer;transition:.15s;background:#fff;}
  .fnav:hover{border-color:var(--green-600);box-shadow:0 10px 26px rgba(13,90,69,.10);transform:translateY(-2px);}
  .fnav .d{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-mute);}
  .fnav .t{font-size:14.5px;font-weight:600;color:var(--ink);margin-top:6px;line-height:1.35;}
  .fnav.next{text-align:right;}
  .fnav.ghost{border:none;background:none;cursor:default;}
  .fnav.ghost:hover{transform:none;box-shadow:none;}

  /* ---------- soon screen ---------- */
  .soon-wrap{max-width:760px;margin:0 auto;padding:90px 40px 150px;}
  .soon-wrap .big{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-600);}
  .soon-wrap h2{font-family:var(--font-ui);font-size:38px;font-weight:800;letter-spacing:-.03em;margin:12px 0 18px;line-height:1.1;display:block;}
  .scope{border:1px solid var(--line);border-radius:13px;padding:22px;margin-top:26px;background:var(--paper-soft);}
  .scope .ch{font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--green-700);margin-bottom:11px;}
  .scope ul{margin:0 0 0 20px;color:var(--ink-soft);font-size:15px;}

  /* ============================== VISUALS ============================== */
  /* diagram card */
  .viz{margin:30px 0 0;border:1px solid var(--line);border-radius:16px;background:#fff;overflow:hidden;}
  .viz-head{padding:15px 20px 0;}
  .viz-kind{font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-600);}
  .viz-title{font-family:var(--font-ui);font-size:15.5px;font-weight:700;color:var(--ink);margin-top:5px;line-height:1.35;}
  .viz-body{padding:16px 20px 4px;overflow-x:auto;}
  .viz-body svg{display:block;max-width:100%;height:auto;margin:0 auto;}
  .viz-cap{padding:0 20px 16px;font-size:13px;color:var(--ink-mute);line-height:1.5;}
  .viz-legend{display:flex;flex-wrap:wrap;gap:8px 16px;padding:0 20px 16px;}
  .viz-legend span{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-soft);font-weight:500;}
  .viz-legend i{width:11px;height:11px;border-radius:3px;display:inline-block;flex:none;}

  /* whiteboard */
  .board{scroll-margin-top:74px;margin:32px 0 0;border:1px solid var(--line-strong);border-radius:18px;background:var(--board);overflow:hidden;
    box-shadow:0 1px 0 rgba(6,40,32,.03),0 18px 40px -28px rgba(6,40,32,.30);}
  .board-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:17px 22px 0;}
  .board-head .bk{font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--green-600);}
  .board-head .bt{font-family:var(--font-ui);font-size:16.5px;font-weight:700;color:var(--ink);margin-top:5px;line-height:1.3;}
  .board-canvas{position:relative;padding:20px 22px 8px;overflow-x:auto;}
  .board-canvas svg{display:block;max-width:100%;height:auto;margin:0 auto;}
  .board-grid{position:absolute;inset:0;pointer-events:none;opacity:.5;
    background-image:linear-gradient(rgba(6,40,32,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(6,40,32,.045) 1px,transparent 1px);
    background-size:26px 26px;}
  .anim-caption{margin:2px 22px 0;min-height:46px;font-size:15px;line-height:1.5;color:var(--ink);font-weight:500;
    background:#fff;border:1px solid var(--line);border-left:3px solid var(--gold-500);border-radius:10px;padding:11px 15px;}
  .anim-caption b{color:var(--green-700);}
  .anim-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:14px 22px 18px;}
  .anim-btn{border:1px solid var(--line-strong);background:#fff;border-radius:9px;height:32px;min-width:34px;padding:0 10px;
    font-size:13px;font-weight:600;color:var(--ink-soft);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;
    gap:6px;transition:.14s;font-family:var(--font-ui);}
  .anim-btn:hover{border-color:var(--green-600);color:var(--green-700);}
  .anim-btn.primary{background:var(--green-700);border-color:var(--green-700);color:#fff;padding:0 15px;}
  .anim-btn.primary:hover{background:var(--green-600);border-color:var(--green-600);color:#fff;}
  .anim-btn:disabled{opacity:.38;cursor:default;}
  .anim-dots{display:flex;gap:5px;margin-left:auto;flex-wrap:wrap;}
  .anim-dots i{width:7px;height:7px;border-radius:99px;background:var(--line-strong);display:block;cursor:pointer;transition:.14s;}
  .anim-dots i.on{background:var(--green-600);} .anim-dots i.now{background:var(--gold-500);transform:scale(1.5);}
  .anim-step{font-family:var(--font-mono);font-size:11px;color:var(--ink-mute);}

  /* ---------- reel: the full width whiteboard lesson ---------- */
  .reel{scroll-margin-top:74px;position:relative;left:50%;transform:translateX(-50%);
    width:min(1180px, calc(100vw - var(--rail-w) - 56px));
    margin:36px 0 0;border:1px solid var(--line-strong);border-radius:22px;background:var(--board);
    overflow:hidden;box-shadow:0 1px 0 rgba(6,40,32,.03),0 26px 60px -34px rgba(6,40,32,.34);}
  .reel-head{padding:20px 26px 0;}
  .reel-head .rk{font-size:9.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--green-600);}
  .reel-head .rt{font-family:var(--font-ui);font-size:21px;font-weight:800;letter-spacing:-.02em;color:var(--ink);margin-top:6px;line-height:1.2;}
  .reel-acts{display:flex;gap:7px;flex-wrap:wrap;align-items:center;padding:16px 26px 0;}
  .reel-part{width:100%;font-size:9.5px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;
    color:var(--ink-mute);margin:10px 0 -2px;display:flex;align-items:center;gap:10px;}
  .reel-part:first-child{margin-top:0;}
  .reel-part::after{content:"";flex:1;height:1px;background:var(--line);}
  .reel-acts button{border:1px solid var(--line-strong);background:#fff;border-radius:99px;padding:6px 13px;
    font-family:var(--font-ui);font-size:11.5px;font-weight:600;color:var(--ink-mute);cursor:pointer;transition:.14s;}
  .reel-acts button:hover{border-color:var(--green-600);color:var(--green-700);}
  .reel-acts button.done{color:var(--green-700);border-color:var(--green-050);background:var(--green-050);}
  .reel-acts button.on{background:var(--green-700);border-color:var(--green-700);color:#fff;}
  .reel-stage{position:relative;padding:22px 26px 6px;min-height:330px;display:flex;align-items:center;justify-content:center;overflow-x:auto;}
  .reel-stage svg{display:block;max-width:100%;height:auto;}
  .reel-act-title{padding:16px 26px 0;font-family:var(--font-ui);font-size:15px;font-weight:700;color:var(--green-700);}
  .reel .anim-caption{margin:10px 26px 0;font-size:16px;min-height:52px;}
  .reel .anim-bar{padding:16px 26px 22px;}
  .reel .viz-legend{padding:14px 26px 0;}
  @media(max-width:1000px){
    .reel{width:calc(100vw - 26px);border-radius:16px;}
    .reel-stage{padding:16px 14px 6px;min-height:240px;}
    .reel-head,.reel-acts,.reel-act-title{padding-left:16px;padding-right:16px;}
    .reel .anim-caption,.reel .anim-bar{margin-left:16px;margin-right:16px;padding-left:0;padding-right:0;}
  }

  /* animated svg states */
  .cell rect{transition:fill .28s,stroke .28s,opacity .28s;}
  .cell text{transition:fill .28s,opacity .28s;}
  @keyframes pulseGold{0%{transform:scale(1)}50%{transform:scale(1.055)}100%{transform:scale(1)}}
  @keyframes popGreen{0%{transform:scale(1)}40%{transform:scale(1.13)}100%{transform:scale(1)}}
  /* the pulse lives on the rect, not on the group. The group carries the shift transform for
     an insert or delete, and a CSS transform on the same element would override that attribute
     for the length of the animation and snap the cell back to where it started. */
  .cell.look rect{animation:pulseGold .5s ease-in-out;transform-box:fill-box;transform-origin:center;}
  .cell.found rect{animation:popGreen .5s ease-out;transform-box:fill-box;transform-origin:center;}
  @media(prefers-reduced-motion:reduce){
    .cell rect,.cell text{transition:none;}
    .cell{transition:none !important;}
    .cell.look rect,.cell.found rect{animation:none;}
    html{scroll-behavior:auto;}
  }

  /* ============================== RESPONSIVE ============================== */
  @media(max-width:1000px){
    .rail{transform:translateX(-100%);transition:transform .24s;}
    .rail.open{transform:translateX(0);}
    .main{margin-left:0;}
    .menu-btn{display:inline-flex;}
    .topbar{padding:0 18px;}
    .wrap{padding:38px 20px 120px;}
    .soon-wrap{padding:60px 20px 120px;}
    .les-title{font-size:32px;}
    .wrap h2{font-size:22px;}
    .footer-nav{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<nav class="rail" id="rail">
  <div class="rail-brand">
    <div class="kicker">The Course</div>
    <h1>DSA Concepts</h1>
    <div class="by">by Rohit Swerashi · 2026 edition</div>
  </div>
  <div class="rail-progress">Your progress
    <div class="pbar"><i></i></div>
  </div>
  <div id="nav"></div>
</nav>
<div class="scrim" id="scrim"></div>

<div class="main">
  <div class="topbar">
    <button class="menu-btn" id="menuBtn">☰</button>
    <div class="crumb" id="crumb"></div>
  </div>
  <div id="view"></div>
</div>

<script>
/* ==================================================================
   DSA Concepts - runtime
   Three engines live here:
     1. the reader  (sidebar, lesson loading, quizzes)
     2. VIZ         (static diagrams, grid layout, collision free by construction)
     3. ANIM        (whiteboard animations, step player)
   Chapter files never contain script. They declare JSON on data-viz / data-anim.
   ================================================================== */

const SCOPE = {};

/* ============================ SHARED SVG HELPERS ============================ */
const CLR = {
  ink:'#0f1a16', soft:'#43524c', mute:'#7e8b86',
  line:'#c9d6d0', lineS:'#9fb3ab',
  g700:'#0d5a45', g600:'#12785d', g500:'#19a077', g050:'#eaf5f0', g950:'#04211a',
  gold:'#f0b429', gold6:'#c98a06', gold0:'#fdf5e0',
  warn:'#b45309', warn0:'#fff5e9', bad:'#b3261e', bad0:'#fdf0ef',
  grey:'#9aa5a1', grey0:'#f1f3f2', white:'#ffffff'
};
const KIND = {
  box:    {fill:CLR.white,  stroke:CLR.lineS, text:CLR.ink},
  accent: {fill:CLR.g050,   stroke:CLR.g600,  text:CLR.g700},
  dark:   {fill:CLR.g700,   stroke:CLR.g700,  text:CLR.white},
  gold:   {fill:CLR.gold0,  stroke:CLR.gold,  text:CLR.gold6},
  warn:   {fill:CLR.warn0,  stroke:CLR.warn,  text:CLR.warn},
  bad:    {fill:CLR.bad0,   stroke:CLR.bad,   text:CLR.bad},
  muted:  {fill:CLR.grey0,  stroke:CLR.grey,  text:CLR.mute}
};
const FONT = "Hanken Grotesk, -apple-system, sans-serif";
const MONO = "JetBrains Mono, ui-monospace, monospace";

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* deterministic text metrics. Hanken Grotesk averages ~0.53em per character. */
function charW(fs){ return fs * 0.545; }
function measure(text, maxChars, fs){
  fs = fs || 12.5; maxChars = maxChars || 22;
  const words = String(text == null ? '' : text).split(/\s+/).filter(Boolean);
  const lines = []; let cur = '';
  for (const w of words){
    if (!cur) cur = w;
    else if ((cur + ' ' + w).length <= maxChars) cur += ' ' + w;
    else { lines.push(cur); cur = w; }
  }
  if (cur) lines.push(cur);
  if (!lines.length) lines.push('');
  const longest = lines.reduce((a,b)=> a.length > b.length ? a : b, '');
  return { lines: lines, w: Math.ceil(longest.length * charW(fs)), h: lines.length * Math.round(fs * 1.32) };
}
function tspans(lines, cx, cy, fs, fill, weight){
  const lh = Math.round(fs * 1.32);
  const top = cy - ((lines.length - 1) * lh) / 2;
  return lines.map(function(l,i){
    return '<text x="' + cx + '" y="' + (top + i*lh) + '" text-anchor="middle" dominant-baseline="central" ' +
      'font-family="' + FONT + '" font-size="' + fs + '" font-weight="' + (weight||600) + '" fill="' + fill + '">' + esc(l) + '</text>';
  }).join('');
}
function labelAt(x, y, txt, fs, fill, anchor, weight){
  return '<text x="' + x + '" y="' + y + '" text-anchor="' + (anchor||'middle') + '" dominant-baseline="central" ' +
    'font-family="' + FONT + '" font-size="' + (fs||10.5) + '" font-weight="' + (weight||600) + '" fill="' + (fill||CLR.mute) + '">' + esc(txt) + '</text>';
}
function chip(x, y, txt, fs, fill, weight){
  fs = fs || 10.5;
  const w = String(txt).length * charW(fs) + 12, h = Math.round(fs * 1.7);
  return '<rect x="' + (x - w/2) + '" y="' + (y - h/2) + '" width="' + w + '" height="' + h + '" rx="5" fill="#ffffff" opacity="0.95"/>' +
    labelAt(x, y, txt, fs, fill || CLR.mute, 'middle', weight || 600);
}
function defsArrows(){
  return '<defs>' +
    '<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">' +
      '<path d="M0,0 L10,5 L0,10 z" fill="' + CLR.lineS + '"/></marker>' +
    '<marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">' +
      '<path d="M0,0 L10,5 L0,10 z" fill="' + CLR.g600 + '"/></marker>' +
    '<marker id="ahy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">' +
      '<path d="M0,0 L10,5 L0,10 z" fill="' + CLR.gold6 + '"/></marker>' +
  '</defs>';
}
function svgOpen(w,h){ return '<svg viewBox="0 0 ' + w + ' ' + h + '" width="' + w + '" role="img">' + defsArrows(); }

/* shape drawing, every shape is centred on its own box */
function shape(n){
  const k = KIND[n.kind] || KIND.box;
  const x = n.x, y = n.y, w = n.w, h = n.h;
  const st = 'fill="' + k.fill + '" stroke="' + k.stroke + '" stroke-width="1.4"';
  if (n.shape === 'diamond'){
    const cx = x + w/2, cy = y + h/2;
    return '<path d="M' + cx + ',' + y + ' L' + (x+w) + ',' + cy + ' L' + cx + ',' + (y+h) + ' L' + x + ',' + cy + ' Z" ' + st + '/>';
  }
  if (n.shape === 'pill')  return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="' + (h/2) + '" ' + st + '/>';
  if (n.shape === 'cyl'){
    const ry = 7;
    return '<path d="M' + x + ',' + (y+ry) + ' a' + (w/2) + ',' + ry + ' 0 0 1 ' + w + ',0 v' + (h-2*ry) +
      ' a' + (w/2) + ',' + ry + ' 0 0 1 ' + (-w) + ',0 Z" ' + st + '/>' +
      '<path d="M' + x + ',' + (y+ry) + ' a' + (w/2) + ',' + ry + ' 0 0 0 ' + w + ',0" fill="none" stroke="' + k.stroke + '" stroke-width="1.2"/>';
  }
  return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="9" ' + st + '/>';
}
function nodeSvg(n){
  const k = KIND[n.kind] || KIND.box;
  return '<g>' + shape(n) + tspans(n.lines, n.x + n.w/2, n.y + n.h/2, n.fs || 12.5, k.text, 600) + '</g>';
}

/* orthogonal router. Edges only ever travel in the gutters between rows and columns. */
function route(a, b, gy){
  const ax = a.x + a.w/2, bx = b.x + b.w/2;
  if (b.y >= a.y + a.h) {                                   /* downward */
    if (Math.abs(ax - bx) < 2) return 'M' + ax + ',' + (a.y + a.h) + ' L' + bx + ',' + b.y;
    const my = a.y + a.h + (gy/2);
    return 'M' + ax + ',' + (a.y+a.h) + ' L' + ax + ',' + my + ' L' + bx + ',' + my + ' L' + bx + ',' + b.y;
  }
  if (b.x >= a.x + a.w) {                                   /* rightward */
    const ay = a.y + a.h/2, by = b.y + b.h/2;
    if (Math.abs(ay - by) < 2) return 'M' + (a.x+a.w) + ',' + ay + ' L' + b.x + ',' + by;
    const mx = a.x + a.w + (gy/2);
    return 'M' + (a.x+a.w) + ',' + ay + ' L' + mx + ',' + ay + ' L' + mx + ',' + by + ' L' + b.x + ',' + by;
  }
  if (b.x + b.w <= a.x) {                                   /* leftward */
    const ay = a.y + a.h/2, by = b.y + b.h/2;
    const mx = a.x - (gy/2);
    return 'M' + a.x + ',' + ay + ' L' + mx + ',' + ay + ' L' + mx + ',' + by + ' L' + (b.x+b.w) + ',' + by;
  }
  const my2 = b.y + b.h + (gy/2);                           /* upward */
  return 'M' + ax + ',' + a.y + ' L' + ax + ',' + (my2) + ' L' + bx + ',' + my2 + ' L' + bx + ',' + (b.y+b.h);
}

function rectsHit(a, b){
  return a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;
}

/* ============================ LAYOUT ENGINES ============================ */
const GAP = { gx:56, gy:46, padX:15, padY:12, minW:104, minH:44 };

/* layered: nodes carry col and row on an integer grid. No two nodes may share a cell,
   so overlap is impossible by construction. Column widths and row heights are the max
   of their members, and every node is centred in its cell. */
function layoutLayered(nodes, opt){
  opt = opt || {};
  const gx = opt.gx || GAP.gx, gy = opt.gy || GAP.gy;
  const seen = {};
  nodes.forEach(function(n){
    const key = n.col + ':' + n.row;
    if (seen[key]) throw new Error('grid collision at col ' + n.col + ' row ' + n.row);
    seen[key] = 1;
    const m = measure(n.label, n.maxChars || opt.maxChars || 20, n.fs || 12.5);
    n.lines = m.lines;
    n.w = Math.max(opt.minW || GAP.minW, m.w + GAP.padX*2);
    n.h = Math.max(GAP.minH, m.h + GAP.padY*2);
    if (n.shape === 'diamond'){ n.w = Math.round(n.w * 1.42); n.h = Math.round(n.h * 1.55); }
  });
  const cols = {}, rows = {};
  nodes.forEach(function(n){
    cols[n.col] = Math.max(cols[n.col] || 0, n.w);
    rows[n.row] = Math.max(rows[n.row] || 0, n.h);
  });
  const colKeys = Object.keys(cols).map(Number).sort(function(a,b){return a-b;});
  const rowKeys = Object.keys(rows).map(Number).sort(function(a,b){return a-b;});
  const colX = {}, rowY = {};
  let x = 0; colKeys.forEach(function(c){ colX[c] = x; x += cols[c] + gx; });
  let y = 0; rowKeys.forEach(function(r){ rowY[r] = y; y += rows[r] + gy; });
  nodes.forEach(function(n){
    n.x = colX[n.col] + (cols[n.col] - n.w)/2;
    n.y = rowY[n.row] + (rows[n.row] - n.h)/2;
  });
  return { w: Math.max(0, x - gx), h: Math.max(0, y - gy), gy: gy };
}

/* browser-side safety net. Never fires when the grid contract is respected. */
function assertNoOverlap(nodes, where){
  for (let i=0;i<nodes.length;i++) for (let j=i+1;j<nodes.length;j++){
    const a = nodes[i], b = nodes[j];
    if (a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h){
      console.warn('[viz] overlap in ' + where + ':', a.label, '<->', b.label);
      return false;
    }
  }
  return true;
}

/* ============================ VIZ RENDERERS ============================ */
const PAD = 14;

function frame(inner, w, h){
  return svgOpen(w + PAD*2, h + PAD*2) + '<g transform="translate(' + PAD + ',' + PAD + ')">' + inner + '</g></svg>';
}
/* like frame, but the canvas grows to swallow anything that spilled outside the authored box */
function frameFit(inner, boxes, w, h){
  let minX = 0, minY = 0, maxX = w, maxY = h;
  boxes.forEach(function(b){
    minX = Math.min(minX, b.x); minY = Math.min(minY, b.y);
    maxX = Math.max(maxX, b.x + b.w); maxY = Math.max(maxY, b.y + b.h);
  });
  return svgOpen(maxX - minX + PAD*2, maxY - minY + PAD*2) +
    '<g transform="translate(' + (PAD - minX) + ',' + (PAD - minY) + ')">' + inner + '</g></svg>';
}
function pathMid(d){
  const pts = (d.match(/[ML]([\d.-]+),([\d.-]+)/g) || []).map(function(t){
    const p = t.slice(1).split(','); return [parseFloat(p[0]), parseFloat(p[1])];
  });
  if (pts.length < 2) return null;
  let total = 0; const seg = [];
  for (let i = 1; i < pts.length; i++){
    const l = Math.hypot(pts[i][0] - pts[i-1][0], pts[i][1] - pts[i-1][1]);
    seg.push(l); total += l;
  }
  let want = total / 2;
  for (let i = 0; i < seg.length; i++){
    if (want <= seg[i] || i === seg.length - 1){
      const t = seg[i] ? want / seg[i] : 0;
      return [pts[i][0] + (pts[i+1][0] - pts[i][0]) * t, pts[i][1] + (pts[i+1][1] - pts[i][1]) * t];
    }
    want -= seg[i];
  }
  return null;
}
function edgeSvg(d, label, style, gy, sink){
  const gold = style === 'gold', green = style === 'green', dash = style === 'dashed';
  const col = gold ? CLR.gold6 : green ? CLR.g600 : CLR.lineS;
  const mk  = gold ? 'ahy' : green ? 'ahg' : 'ah';
  let out = '<path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="1.5" ' +
    (dash ? 'stroke-dasharray="5 4" ' : '') + 'marker-end="url(#' + mk + ')"/>';
  if (label){
    const p = pathMid(d);
    if (p){
      if (sink) sink.push([p[0], p[1], label, col]);
      else out += chip(p[0], p[1], label, 10, col, 600);
    }
  }
  return out;
}

/* ---- layered family: flowchart, decision tree, state, user flow, architecture, component, IA ---- */
function renderLayered(spec, preset){
  const nodes = (spec.nodes || []).map(function(n){
    return Object.assign({}, n, { shape: n.shape || preset.shape || 'box', kind: n.kind || preset.kind || 'box' });
  });
  const edges = spec.edges || [];
  const widest = edges.reduce(function(m, e){
    return Math.max(m, e.label ? String(e.label).length * charW(10) + 22 : 0);
  }, 0);
  const gx = Math.max(spec.gx || preset.gx || GAP.gx, widest);
  const box = layoutLayered(nodes, { gx: gx, gy: spec.gy || preset.gy, maxChars: spec.maxChars });
  assertNoOverlap(nodes, spec.title || preset.name);
  const by = {}; nodes.forEach(function(n){ by[n.id] = n; });
  const addr = !!preset.addressable;
  const elabels = [];
  let out = '';
  edges.forEach(function(e){
    const a = by[e.from], b = by[e.to];
    if (!a || !b) return;
    const sink = [];
    const path = edgeSvg(route(a, b, box.gy), e.label, e.style, box.gy, sink);
    sink.forEach(function(l){ elabels.push([l[0], l[1], l[2], l[3], e.from + '-' + e.to]); });
    out += addr ? '<g class="ge" data-e="' + e.from + '-' + e.to + '" opacity="1">' + path + '</g>' : path;
  });
  nodes.forEach(function(n){
    out += addr ? '<g class="cell" data-i="' + n.id + '" opacity="1">' + nodeSvg(n) + '</g>' : nodeSvg(n);
  });
  /* Two edges running between the same pair of nodes share a midpoint, so their labels would
     print on top of each other. Each label takes the first offset that collides with nothing
     already placed, counting the nodes themselves as obstacles. */
  const occupied = nodes.map(function(n){ return { x:n.x, y:n.y, w:n.w, h:n.h }; });
  const OFFSETS = [0, 17, -17, 34, -34, 51, -51];
  elabels.forEach(function(l){
    const lw = String(l[2]).length * charW(10) + 12, lh = 18;
    let y = l[1];
    for (const dy of OFFSETS){
      const r = { x: l[0] - lw/2, y: l[1] + dy - lh/2, w: lw, h: lh };
      if (!occupied.some(function(o){ return rectsHit(r, o); })){ y = l[1] + dy; break; }
    }
    occupied.push({ x: l[0] - lw/2, y: y - lh/2, w: lw, h: lh });
    const c = chip(l[0], y, l[2], 10, l[3], 600);
    out += addr ? '<g class="ge" data-e="' + l[4] + '" opacity="1">' + c + '</g>' : c;
  });
  (spec.groups || []).forEach(function(g){
    const mem = g.nodes.map(function(id){ return by[id]; }).filter(Boolean);
    if (!mem.length) return;
    const x1 = Math.min.apply(null, mem.map(function(n){return n.x;})) - 14;
    const y1 = Math.min.apply(null, mem.map(function(n){return n.y;})) - 26;
    const x2 = Math.max.apply(null, mem.map(function(n){return n.x + n.w;})) + 14;
    const y2 = Math.max.apply(null, mem.map(function(n){return n.y + n.h;})) + 14;
    out = '<g><rect x="' + x1 + '" y="' + y1 + '" width="' + (x2-x1) + '" height="' + (y2-y1) + '" rx="13" fill="none" ' +
          'stroke="' + CLR.line + '" stroke-width="1.2" stroke-dasharray="6 5"/>' +
          labelAt(x1 + 12, y1 + 12, g.label, 10, CLR.mute, 'start', 700) + '</g>' + out;
  });
  return frame(out, box.w, box.h);
}

/* ---- sequence diagram ---- */
function renderSeq(spec){
  const actors = spec.actors || [];
  const msgs = spec.messages || [];
  const colW = 168, headH = 46, top = headH + 26, stepH = 46;
  const w = Math.max(colW * actors.length, 420);
  const h = top + msgs.length * stepH + 20;
  const cx = actors.map(function(_, i){ return i * colW + colW/2; });
  let out = '';
  actors.forEach(function(a, i){
    const m = measure(a.label || a, 18, 12);
    const bw = Math.max(120, m.w + 26), bx = cx[i] - bw/2;
    const k = KIND[(a.kind) || 'accent'];
    out += '<rect x="' + bx + '" y="0" width="' + bw + '" height="' + headH + '" rx="10" fill="' + k.fill + '" stroke="' + k.stroke + '" stroke-width="1.4"/>' +
           tspans(m.lines, cx[i], headH/2, 12, k.text, 700) +
           '<line x1="' + cx[i] + '" y1="' + headH + '" x2="' + cx[i] + '" y2="' + (h - 12) + '" stroke="' + CLR.line + '" stroke-width="1.2" stroke-dasharray="4 5"/>';
  });
  msgs.forEach(function(mg, i){
    const y = top + i * stepH;
    const a = cx[mg.from], b = cx[mg.to];
    const col = mg.style === 'gold' ? CLR.gold6 : mg.style === 'green' ? CLR.g600 : CLR.lineS;
    const mk  = mg.style === 'gold' ? 'ahy' : mg.style === 'green' ? 'ahg' : 'ah';
    if (a === b){
      out += '<path d="M' + a + ',' + y + ' h34 v22 h-34" fill="none" stroke="' + col + '" stroke-width="1.5" marker-end="url(#' + mk + ')"/>' +
             labelAt(a + 44, y + 11, mg.label, 10.5, CLR.soft, 'start', 600);
    } else {
      out += '<line x1="' + a + '" y1="' + y + '" x2="' + b + '" y2="' + y + '" stroke="' + col + '" stroke-width="1.5" ' +
             (mg.style === 'dashed' ? 'stroke-dasharray="5 4" ' : '') + 'marker-end="url(#' + mk + ')"/>';
      const mx = (a + b)/2, lw = String(mg.label || '').length * charW(10.5) + 12;
      out += '<rect x="' + (mx - lw/2) + '" y="' + (y - 19) + '" width="' + lw + '" height="17" rx="5" fill="#ffffff"/>' +
             labelAt(mx, y - 11, mg.label, 10.5, CLR.soft, 'middle', 600);
    }
    out += labelAt(-6, y, String(i+1), 9.5, CLR.mute, 'end', 700);
  });
  return frame(out, w, h);
}

/* ---- swimlane ---- */
function renderSwim(spec){
  const lanes = spec.lanes || [], steps = spec.steps || [];
  const laneW = 132, colW = 176, laneH = 78;
  const ncol = Math.max.apply(null, steps.map(function(s){ return s.col; }).concat([0])) + 1;
  const w = laneW + ncol * colW, h = lanes.length * laneH;
  let out = '';
  lanes.forEach(function(l, i){
    const y = i * laneH;
    out += '<rect x="0" y="' + y + '" width="' + w + '" height="' + laneH + '" fill="' + (i % 2 ? CLR.grey0 : '#ffffff') + '"/>' +
           '<rect x="0" y="' + y + '" width="' + laneW + '" height="' + laneH + '" fill="' + CLR.g050 + '"/>' +
           '<line x1="0" y1="' + y + '" x2="' + w + '" y2="' + y + '" stroke="' + CLR.line + '" stroke-width="1"/>';
    const m = measure(l.label || l, 15, 12);
    out += tspans(m.lines, laneW/2, y + laneH/2, 12, CLR.g700, 700);
  });
  out += '<line x1="0" y1="' + h + '" x2="' + w + '" y2="' + h + '" stroke="' + CLR.line + '" stroke-width="1"/>' +
         '<line x1="' + laneW + '" y1="0" x2="' + laneW + '" y2="' + h + '" stroke="' + CLR.lineS + '" stroke-width="1.2"/>';
  const pos = {};
  steps.forEach(function(s){
    const m = measure(s.label, 18, 11.5);
    const bw = Math.min(colW - 26, Math.max(112, m.w + 22)), bh = Math.max(38, m.h + 18);
    const x = laneW + s.col * colW + (colW - bw)/2, y = s.lane * laneH + (laneH - bh)/2;
    pos[s.id != null ? s.id : (s.lane + '-' + s.col)] = { x:x, y:y, w:bw, h:bh };
    const k = KIND[s.kind || 'box'];
    out += '<rect x="' + x + '" y="' + y + '" width="' + bw + '" height="' + bh + '" rx="9" fill="' + k.fill + '" stroke="' + k.stroke + '" stroke-width="1.4"/>' +
           tspans(m.lines, x + bw/2, y + bh/2, 11.5, k.text, 600);
  });
  (spec.edges || []).forEach(function(e){
    const a = pos[e.from], b = pos[e.to];
    if (a && b) out = out + edgeSvg(route(a, b, 34), e.label, e.style, 34);
  });
  return frame(out, w, h);
}

/* ---- journey map ---- */
function renderJourney(spec){
  const st = spec.stages || [];
  const colW = 172, rowLabelW = 108, rows = ['Stage','Doing','Thinking'];
  const rowH = 62, feelH = 92;
  const w = rowLabelW + st.length * colW, h = rows.length * rowH + feelH + 26;
  let out = '';
  rows.forEach(function(r, i){
    const y = i * rowH;
    out += '<rect x="0" y="' + y + '" width="' + w + '" height="' + rowH + '" fill="' + (i === 0 ? CLR.g050 : (i % 2 ? '#ffffff' : CLR.grey0)) + '"/>' +
           '<line x1="0" y1="' + y + '" x2="' + w + '" y2="' + y + '" stroke="' + CLR.line + '"/>' +
           labelAt(12, y + rowH/2, r, 10, CLR.mute, 'start', 700);
  });
  st.forEach(function(s, i){
    const x = rowLabelW + i * colW;
    out += '<line x1="' + x + '" y1="0" x2="' + x + '" y2="' + (rows.length*rowH) + '" stroke="' + CLR.line + '"/>';
    [s.stage, s.doing, s.thinking].forEach(function(txt, r){
      const m = measure(txt || '', 20, r === 0 ? 12.5 : 11);
      out += tspans(m.lines, x + colW/2, r*rowH + rowH/2, r === 0 ? 12.5 : 11, r === 0 ? CLR.g700 : CLR.soft, r === 0 ? 700 : 500);
    });
  });
  const fy = rows.length * rowH + 14;
  out += '<rect x="0" y="' + fy + '" width="' + w + '" height="' + feelH + '" fill="#ffffff"/>' +
         labelAt(12, fy + feelH/2, 'Feeling', 10, CLR.mute, 'start', 700);
  const pts = st.map(function(s, i){
    const v = Math.max(1, Math.min(5, s.feeling || 3));
    return [rowLabelW + i*colW + colW/2, fy + feelH - ((v-1)/4) * (feelH - 26) - 13];
  });
  out += '<polyline points="' + pts.map(function(p){return p[0]+','+p[1];}).join(' ') + '" fill="none" stroke="' + CLR.gold + '" stroke-width="2.4" stroke-linejoin="round"/>';
  pts.forEach(function(p, i){
    const v = st[i].feeling || 3;
    const c = v >= 4 ? CLR.g600 : v <= 2 ? CLR.bad : CLR.gold6;
    out += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="6" fill="#ffffff" stroke="' + c + '" stroke-width="2.4"/>';
  });
  return frame(out, w, h);
}

/* ---- network and knowledge graph: authored coordinates on a unit grid ---- */
function renderNet(spec){
  const unit = spec.unit || 118;
  const nodes = (spec.nodes || []).map(function(n){
    const m = measure(n.label, n.maxChars || 16, 11.5);
    const r = Math.max(30, m.w/2 + 13);
    return Object.assign({}, n, { lines:m.lines, cx:n.x*unit, cy:n.y*unit, r:r, kind:n.kind || 'box' });
  });
  const minX = Math.min.apply(null, nodes.map(function(n){return n.cx - n.r;}));
  const minY = Math.min.apply(null, nodes.map(function(n){return n.cy - n.r - 4;}));
  nodes.forEach(function(n){ n.cx -= minX; n.cy -= minY; });
  const maxX = Math.max.apply(null, nodes.map(function(n){return n.cx + n.r;}));
  const maxY = Math.max.apply(null, nodes.map(function(n){return n.cy + n.r;}));
  const by = {}; nodes.forEach(function(n){ by[n.id] = n; });
  let out = '';
  (spec.edges || []).forEach(function(e){
    const a = by[e.from], b = by[e.to];
    if (!a || !b) return;
    const dx = b.cx-a.cx, dy = b.cy-a.cy, d = Math.sqrt(dx*dx+dy*dy) || 1;
    const x1 = a.cx + dx/d*a.r, y1 = a.cy + dy/d*a.r, x2 = b.cx - dx/d*(b.r+7), y2 = b.cy - dy/d*(b.r+7);
    const col = e.style === 'gold' ? CLR.gold6 : e.style === 'green' ? CLR.g600 : CLR.lineS;
    const mk  = e.style === 'gold' ? 'ahy' : e.style === 'green' ? 'ahg' : 'ah';
    out += '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' + col + '" stroke-width="1.5" ' +
           (e.dashed ? 'stroke-dasharray="5 4" ' : '') + (e.arrow === false ? '' : 'marker-end="url(#' + mk + ')"');
    out += '/>';
    if (e.label){
      const mx = (x1+x2)/2, my = (y1+y2)/2, lw = String(e.label).length * charW(10) + 10;
      out += '<rect x="' + (mx-lw/2) + '" y="' + (my-9) + '" width="' + lw + '" height="18" rx="5" fill="#ffffff" opacity="0.95"/>' +
             labelAt(mx, my, e.label, 10, col, 'middle', 600);
    }
  });
  nodes.forEach(function(n){
    const k = KIND[n.kind];
    out += '<circle cx="' + n.cx + '" cy="' + n.cy + '" r="' + n.r + '" fill="' + k.fill + '" stroke="' + k.stroke + '" stroke-width="1.6"/>' +
           tspans(n.lines, n.cx, n.cy, 11.5, k.text, 600);
  });
  return frame(out, maxX, maxY);
}

/* ---- entity relationship diagram ---- */
function renderErd(spec){
  const ents = spec.entities || [];
  const colW = 236, rowGap = 40, headH = 38, fieldH = 25;
  const placed = ents.map(function(e){
    const h = headH + (e.fields || []).length * fieldH;
    return Object.assign({}, e, { w:200, h:h });
  });
  const cols = {}, rows = {};
  placed.forEach(function(e){ cols[e.col] = 1; rows[e.row] = Math.max(rows[e.row]||0, e.h); });
  const rowKeys = Object.keys(rows).map(Number).sort(function(a,b){return a-b;});
  const rowY = {}; let y = 0;
  rowKeys.forEach(function(r){ rowY[r] = y; y += rows[r] + rowGap; });
  placed.forEach(function(e){ e.x = e.col * colW; e.y = rowY[e.row]; });
  const w = Math.max.apply(null, placed.map(function(e){return e.x + e.w;}));
  const h = Math.max(0, y - rowGap);
  const by = {}; placed.forEach(function(e){ by[e.name] = e; });
  let out = '';
  (spec.rels || []).forEach(function(r){
    const a = by[r.from], b = by[r.to];
    if (a && b) out += edgeSvg(route(a, b, rowGap), r.label, 'green', rowGap);
  });
  placed.forEach(function(e){
    out += '<rect x="' + e.x + '" y="' + e.y + '" width="' + e.w + '" height="' + e.h + '" rx="10" fill="#ffffff" stroke="' + CLR.lineS + '" stroke-width="1.4"/>' +
           '<path d="M' + e.x + ',' + (e.y+10) + ' a10,10 0 0 1 10,-10 h180 a10,10 0 0 1 10,10 v' + (headH-10) + ' h-200 Z" fill="' + CLR.g700 + '"/>' +
           labelAt(e.x + e.w/2, e.y + headH/2, e.name, 12.5, '#ffffff', 'middle', 700);
    (e.fields || []).forEach(function(f, i){
      const fy = e.y + headH + i*fieldH;
      out += '<line x1="' + e.x + '" y1="' + fy + '" x2="' + (e.x+e.w) + '" y2="' + fy + '" stroke="' + CLR.line + '"/>' +
             labelAt(e.x + 12, fy + fieldH/2, f.name, 11, f.key ? CLR.gold6 : CLR.soft, 'start', f.key ? 700 : 500) +
             labelAt(e.x + e.w - 12, fy + fieldH/2, f.type || '', 10, CLR.mute, 'end', 500);
    });
  });
  return frame(out, w, h);
}

/* ---- screen wireframe ---- */
function renderWire(spec){
  const w = spec.width || 520, colU = w/12;

            '<rect x="0" y="0" width="' + w + '" height="34" rx="14" fill="' + CLR.grey0 + '"/>' +
            '<rect x="0" y="24" width="' + w + '" height="10" fill="' + CLR.grey0 + '"/>' +
            '<line x1="0" y1="34" x2="' + w + '" y2="34" stroke="' + CLR.line + '"/>';
  ['#e06c5f','#e8bb50','#6fbf73'].forEach(function(c, i){ out += '<circle cx="' + (18 + i*15) + '" cy="17" r="4.6" fill="' + c + '"/>'; });

    if (b.label){
      const m = measure(b.label, Math.max(8, Math.floor(bw / charW(11.5))), 11.5);
      out += tspans(m.lines, x + bw/2, y + bh/2, 11.5, k.text, 600);

}

/* ---- growth curves ---- */
function renderCurve(spec){
  const w = spec.width || 520, h = spec.height || 250, ml = 46, mb = 34, mt = 14, mr = 96;
  const px = w - ml - mr, py = h - mt - mb;
  const N = spec.n || 32;
  const FN = {
    '1':     function(){ return 1; },
    'logn':  function(n){ return Math.log2(n + 1); },
    'sqrtn': function(n){ return Math.sqrt(n); },
    'n':     function(n){ return n; },
    'nlogn': function(n){ return n * Math.log2(n + 1); },
    'n2':    function(n){ return n * n; },
    'n3':    function(n){ return n * n * n; },
    '2n':    function(n){ return Math.pow(2, Math.min(n, 60)); },
    'nfact': function(n){ let v = 1; for (let k = 2; k <= Math.min(n, 20); k++) v *= k; return v; }
  };
  const series = (spec.series || []).map(function(s){
    const f = FN[s.fn] || FN.n;
    const pts = []; for (let i = 1; i <= N; i++) pts.push([i, f(i)]);
    return { label:s.label, color:s.color === 'gold' ? CLR.gold : s.color === 'bad' ? CLR.bad : s.color === 'green' ? CLR.g600 : CLR.grey, pts:pts };
  });
  const maxY = spec.maxY || Math.max.apply(null, series.map(function(s){ return s.pts[s.pts.length-1][1]; }));
  const LOG = !!spec.logScale;
  const frac = function(v){ return LOG ? Math.log10(Math.max(1, v)) / Math.log10(Math.max(10, maxY))
                                       : Math.min(1, v / maxY); };
  let out = '<line x1="' + ml + '" y1="' + mt + '" x2="' + ml + '" y2="' + (mt+py) + '" stroke="' + CLR.lineS + '" stroke-width="1.2"/>' +
            '<line x1="' + ml + '" y1="' + (mt+py) + '" x2="' + (ml+px) + '" y2="' + (mt+py) + '" stroke="' + CLR.lineS + '" stroke-width="1.2"/>' +
            labelAt(ml + px/2, mt + py + 22, spec.xlabel || 'how much data', 11, CLR.mute, 'middle', 600) +
            '<g transform="translate(14,' + (mt + py/2) + ') rotate(-90)">' +
              labelAt(0, 0, (spec.ylabel || 'steps of work') + (LOG ? ', log scale' : ''), 11, CLR.mute, 'middle', 600) + '</g>';
  series.forEach(function(s){
    const d = s.pts.map(function(p, i){
      const x = ml + (p[0]/N) * px, y = mt + py - Math.min(1, p[1]/maxY) * py;
      return (i ? 'L' : 'M') + x.toFixed(1) + ',' + y.toFixed(1);
    }).join(' ');
    out += '<path d="' + d + '" fill="none" stroke="' + s.color + '" stroke-width="2.4" stroke-linecap="round"/>';
    const last = s.pts[s.pts.length-1];
    const ly = mt + py - Math.min(1, last[1]/maxY) * py;
    out += labelAt(ml + px + 9, Math.max(mt + 6, ly), s.label, 11, s.color, 'start', 700);
  });
  return frame(out, w, h);
}

/* ---- real-life scene: a tiny illustration primitive set ---- */
/* --- collision helpers --- */
function segHitsRect(x1, y1, x2, y2, r){
  if (Math.max(x1,x2) < r.x || Math.min(x1,x2) > r.x + r.w) return false;
  if (Math.max(y1,y2) < r.y || Math.min(y1,y2) > r.y + r.h) return false;
  const steps = 24;
  for (let i = 0; i <= steps; i++){
    const t = i/steps, px = x1 + (x2-x1)*t, py = y1 + (y2-y1)*t;
    if (px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h) return true;
  }
  return false;
}
function iconBox(it){
  const s = it.scale || 1.3;
  const W = { person:44, doc:40, server:52, phone:38, glass:52, shelf:88, pile:70 }[it.icon] || 110;
  const H = { person:60, doc:60, server:56, phone:60, glass:48, shelf:60, pile:44 }[it.icon] || 46;
  return { x: it.x - (W*s)/2, y: it.y - (H*s)/2, w: W*s, h: H*s };
}
function sceneIcon(it){
  const x = it.x, y = it.y, k = KIND[it.kind || 'box'], s = it.scale || 1.3;
  const cap = '';
  if (it.icon === 'person'){
    return '<g><circle cx="' + x + '" cy="' + (y-14*s) + '" r="' + (10*s) + '" fill="' + k.fill + '" stroke="' + k.stroke + '" stroke-width="1.6"/>' +
      '<path d="M' + (x-15*s) + ',' + (y+18*s) + ' a' + (15*s) + ',' + (17*s) + ' 0 0 1 ' + (30*s) + ',0 Z" fill="' + k.fill + '" stroke="' + k.stroke + '" stroke-width="1.6"/></g>' + cap;
  }
  if (it.icon === 'doc'){
    return '<g><path d="M' + (x-13*s) + ',' + (y-20*s) + ' h' + (18*s) + ' l' + (8*s) + ',' + (8*s) + ' v' + (32*s) + ' h' + (-26*s) + ' Z" fill="' + k.fill + '" stroke="' + k.stroke + '" stroke-width="1.5"/>' +
      '<path d="M' + (x-7*s) + ',' + (y-4*s) + ' h' + (14*s) + ' M' + (x-7*s) + ',' + (y+4*s) + ' h' + (14*s) + '" stroke="' + k.stroke + '" stroke-width="1.2"/></g>' + cap;
  }
  if (it.icon === 'server'){
    return '<g>' + [0,1,2].map(function(i){
      return '<rect x="' + (x-19*s) + '" y="' + (y-22*s + i*15*s) + '" width="' + (38*s) + '" height="' + (12*s) + '" rx="3" fill="' + k.fill + '" stroke="' + k.stroke + '" stroke-width="1.4"/>' +
             '<circle cx="' + (x-12*s) + '" cy="' + (y-16*s + i*15*s) + '" r="2" fill="' + CLR.g500 + '"/>';
    }).join('') + '</g>' + cap;
  }
  if (it.icon === 'phone'){
    return '<g><rect x="' + (x-14*s) + '" y="' + (y-26*s) + '" width="' + (28*s) + '" height="' + (50*s) + '" rx="6" fill="' + k.fill + '" stroke="' + k.stroke + '" stroke-width="1.6"/>' +
      '<rect x="' + (x-9*s) + '" y="' + (y-19*s) + '" width="' + (18*s) + '" height="' + (30*s) + '" rx="2" fill="' + CLR.grey0 + '"/></g>' + cap;
  }
  if (it.icon === 'glass'){
    return '<g><circle cx="' + x + '" cy="' + (y-6*s) + '" r="' + (14*s) + '" fill="none" stroke="' + k.stroke + '" stroke-width="2.4"/>' +
      '<line x1="' + (x+10*s) + '" y1="' + (y+4*s) + '" x2="' + (x+22*s) + '" y2="' + (y+16*s) + '" stroke="' + k.stroke + '" stroke-width="2.8" stroke-linecap="round"/></g>' + cap;
  }
  if (it.icon === 'shelf'){
    return '<g>' + [0,1].map(function(r){ return [0,1,2,3].map(function(c){
      return '<rect x="' + (x-34*s + c*18*s) + '" y="' + (y-22*s + r*22*s) + '" width="' + (13*s) + '" height="' + (18*s) + '" rx="2" fill="' + k.fill + '" stroke="' + k.stroke + '" stroke-width="1.2"/>';
    }).join(''); }).join('') +
      '<line x1="' + (x-38*s) + '" y1="' + (y-2*s) + '" x2="' + (x+38*s) + '" y2="' + (y-2*s) + '" stroke="' + CLR.lineS + '" stroke-width="2"/>' +
      '<line x1="' + (x-38*s) + '" y1="' + (y+22*s) + '" x2="' + (x+38*s) + '" y2="' + (y+22*s) + '" stroke="' + CLR.lineS + '" stroke-width="2"/></g>' + cap;
  }
  if (it.icon === 'pile'){
    return '<g>' + [0,1,2,3,4,5].map(function(i){
      const ox = ((i*37) % 44) - 22, oy = ((i*53) % 26) - 13;
      return '<rect x="' + (x+ox*s) + '" y="' + (y+oy*s) + '" width="' + (15*s) + '" height="' + (12*s) + '" rx="2" fill="' + k.fill + '" stroke="' + k.stroke + '" stroke-width="1.2" transform="rotate(' + ((i*29)%40 - 20) + ' ' + (x+ox*s) + ' ' + (y+oy*s) + ')"/>';
    }).join('') + '</g>' + cap;
  }
  const m = measure(it.label || '', 16, 11.5);
  const bw = Math.max(96, m.w + 24), bh = Math.max(38, m.h + 18);
  return '<g><rect x="' + (x-bw/2) + '" y="' + (y-bh/2) + '" width="' + bw + '" height="' + bh + '" rx="9" fill="' + k.fill + '" stroke="' + k.stroke + '" stroke-width="1.4"/>' +
    tspans(m.lines, x, y, 11.5, k.text, 600) + '</g>';
}
function renderScene(spec){
  const items = spec.items || [];
  const w = spec.width || 560, h = spec.height || 220;
  const arrows = spec.arrows || [];
  let lines = '', labels = '';
  arrows.forEach(function(a){
    const col = a.style === 'gold' ? CLR.gold6 : a.style === 'green' ? CLR.g600 : CLR.lineS;
    const mk  = a.style === 'gold' ? 'ahy' : a.style === 'green' ? 'ahg' : 'ah';
    lines += '<line x1="' + a.x1 + '" y1="' + a.y1 + '" x2="' + a.x2 + '" y2="' + a.y2 + '" stroke="' + col + '" stroke-width="1.8" ' +
             (a.dashed ? 'stroke-dasharray="5 4" ' : '') + 'marker-end="url(#' + mk + ')"/>';
    if (a.label){
      const dx = a.x2-a.x1, dy = a.y2-a.y1, L = Math.hypot(dx,dy) || 1;
      const off = a.off == null ? 20 : a.off;
      labels += chip((a.x1+a.x2)/2 - (dy/L)*off, (a.y1+a.y2)/2 + (dx/L)*off, a.label, 10.5, col, 700);
    }
  });
  /* draw order matters: connective lines first, then the objects, then every label on top,
     so a caption can never end up underneath the line it is describing */
  const body = items.map(sceneIcon).join('');

  /* every caption is placed against everything already on the board: the icons, the arrow
     chips, the arrow lines themselves, and the captions placed before it. The first
     candidate slot that collides with nothing wins, so a scene cannot render on top of itself. */
  const taken = items.map(iconBox);
  arrows.forEach(function(a){
    if (!a.label) return;
    const dx = a.x2-a.x1, dy = a.y2-a.y1, L = Math.hypot(dx,dy) || 1;
    const off = a.off == null ? 20 : a.off;
    const cw = String(a.label).length * charW(10.5) + 12;
    taken.push({ x:(a.x1+a.x2)/2 - (dy/L)*off - cw/2, y:(a.y1+a.y2)/2 + (dx/L)*off - 9, w:cw, h:18 });
  });
  let caps = '';
  items.forEach(function(it){
    if (!it.label) return;
    const sc = it.scale || 1.3, ib = iconBox(it);
    const cw = String(it.label).length * charW(11) + 14, chh = 20;
    const slots = [ ib.y + ib.h + 16, ib.y - 16 - chh, ib.y + ib.h + 40, ib.y - 40 - chh ];
    let cy = slots[0];
    for (const cand of slots){
      const r = { x: it.x - cw/2, y: cand, w: cw, h: chh };
      const hitsBox = taken.some(function(t){ return rectsHit(r, t); });
      const hitsLine = arrows.some(function(a){ return segHitsRect(a.x1, a.y1, a.x2, a.y2, r); });
      if (!hitsBox && !hitsLine){ cy = cand; break; }
    }
    taken.push({ x: it.x - cw/2, y: cy, w: cw, h: chh });
    caps += chip(it.x, cy + chh/2, it.label, 11, CLR.soft, 600);
  });
  arrows.forEach(function(a){
    taken.push({ x:Math.min(a.x1,a.x2), y:Math.min(a.y1,a.y2), w:Math.abs(a.x2-a.x1), h:Math.abs(a.y2-a.y1) });
  });
  return frameFit(lines + body + caps + labels, taken, w, h);
}
