      {"id":"q1","label":"Is the collection in a known order?","col":1,"row":0,"kind":"gold","shape":"diamond"},
      {"id":"lin","label":"Linear scan. It is your only honest option","col":0,"row":1,"kind":"muted"},
      {"id":"q2","label":"Can you jump straight to any position?","col":2,"row":1,"kind":"gold","shape":"diamond"},
      {"id":"walk","label":"Walk the structure: tree or chain","col":1,"row":2,"kind":"accent"},
      {"id":"bin","label":"Binary search, or an index built on it","col":3,"row":2,"kind":"accent"}
    ],
    "edges":[
      {"from":"q1","to":"lin","label":"no"},
      {"from":"q1","to":"q2","label":"yes","style":"green"},
      {"from":"q2","to":"walk","label":"no"},
      {"from":"q2","to":"bin","label":"yes","style":"green"}
    ],
    "caption":"Two questions, four outcomes. You are not picking a favourite algorithm here, you are finding out which ones the data has already ruled out for you."
  }'></div>

  <h2><span class="ix">6</span> What It Costs, In Plain English</h2>
  <div class="sub">Forget the notation for sixty seconds and just count.</div>
  <p>Put a hundred items in front of a linear scan and it may look a hundred times. Double the data to two hundred and it looks two hundred times. The work grows exactly as fast as the pile does. Now do the same to binary search: a hundred items costs about seven looks, two hundred costs eight. <strong>Doubling the data adds one single look.</strong> That is not a small improvement, it is a different category of thing.</p>

  <div class="viz" data-viz='{
    "type":"curve","title":"How the work grows as the pile grows","width":540,"height":250,
    "xlabel":"how many things you are searching","ylabel":"how many looks it takes",
    "series":[
      {"label":"linear scan","fn":"n","color":"bad"},
      {"label":"binary search","fn":"logn","color":"green"},
      {"label":"hash lookup","fn":"1","color":"gold"}
    ],
    "caption":"The red line is what happens when nobody kept order. The green line is what one sorted collection buys you. The gold line is what spare memory buys you, and it is almost flat."
  }'></div>

  <div class="viz" data-viz='{
    "type":"card","title":"Looks needed to find one item","eyebrow":"THE NUMBERS","badge":"1 million rows","width":400,
    "rows":[
      {"k":"Linear scan, worst case","v":"1,000,000","tone":"bad","bar":1},
      {"k":"Linear scan, average","v":"500,000","tone":"bad","bar":0.5},
      {"k":"Binary search","v":"20","tone":"good","bar":0.02},
      {"k":"Hash lookup","v":"1","tone":"good","bar":0.01}
    ],
    "footer":"Same million rows. The only variable is how much order was kept beforehand."
  }'></div>

  <h2><span class="ix">7</span> Where It Lives In Real Life</h2>
  <div class="sub">Four systems you touched this week, and the search sitting inside each one.</div>

  <div class="viz" data-viz='{
    "type":"kgraph","title":"Search is not one feature, it is a layer under everything","unit":132,
    "nodes":[
      {"id":"s","label":"Searching","x":2,"y":1,"kind":"dark"},
      {"id":"ctrl","label":"Ctrl and F","x":0,"y":0,"kind":"box"},
      {"id":"db","label":"Database index","x":0,"y":2,"kind":"box"},
      {"id":"map","label":"Maps routing","x":4,"y":0,"kind":"box"},
      {"id":"rag","label":"AI chatbot memory","x":4,"y":2,"kind":"gold"},
      {"id":"auto","label":"Autocomplete","x":2,"y":3,"kind":"box"}
    ],
    "edges":[
      {"from":"s","to":"ctrl","label":"linear"},
      {"from":"s","to":"db","label":"tree"},
      {"from":"s","to":"map","label":"graph"},
      {"from":"s","to":"rag","label":"vector","style":"gold"},
      {"from":"s","to":"auto","label":"prefix"}
    ],
    "caption":"Five products, five different search methods, one identical question underneath. When you meet a new product, the useful instinct is to ask which of these five edges it is standing on."
  }'></div>

  <p>The one worth sitting with is the last one. When you ask an AI assistant a question about your own documents, it cannot read all of them for every question, that would be a linear scan across gigabytes. So it does what the labelled cupboard did: it pays a cost <em class="k">once</em>, turning every document into coordinates, so that later it can jump near the answer instead of walking to it. Lesson 6.6 is entirely about that move.</p>

  <h2><span class="ix">8</span> How Problems Show Up</h2>
  <div class="sub">The phrasings that are secretly search problems, and the tell in each one.</div>
  <p>Real problems never say the word <em class="k">searching</em>. They describe a symptom. Here is how to hear it.</p>

  <div class="tbl-wrap"><table>
    <tr><th>What somebody actually says</th><th>The tell</th><th>What it is really asking</th></tr>
    <tr><td>"The report page takes eleven seconds to load"</td><td>Time grows with data size</td><td>A linear scan where an index belonged</td></tr>
    <tr><td>"Find whether this email already exists"</td><td>Yes or no, exact key</td><td>A hash lookup, not a scan</td></tr>
    <tr><td>"Show me everything between two dates"</td><td>A range, not one item</td><td>A sorted structure, then two boundary searches</td></tr>
    <tr><td>"Suggest as the user types"</td><td>Prefix, and it must feel instant</td><td>A trie or prefix index</td></tr>
    <tr><td>"Find the answer in our documents"</td><td>Meaning, not exact words</td><td>Vector search over embeddings</td></tr>
    <tr><td>"It was fast in testing and slow in production"</td><td>Cost scaled with real data</td><td>The method never changed, the pile did</td></tr>
  </table>
  <div class="tbl-cap">Middle column is the skill. Once you can name the tell, the right structure is usually only one step away.</div></div>

  <h2><span class="ix">9</span> Solve It Live</h2>
  <div class="sub">A real complaint, taken from words to a decision.</div>
  <div class="callout">
    <div class="ch">The problem, as it arrives</div>
    <p>"Our support tool has 400,000 saved tickets. Agents type a ticket number and wait about four seconds every time. It was instant last year. Nothing in the code changed."</p>
  </div>

  <div class="viz" data-viz='{
    "type":"swim","title":"From complaint to decision, without guessing",
    "lanes":[{"label":"The agent"},{"label":"You"},{"label":"The system"}],
    "steps":[
      {"id":"a1","lane":0,"col":0,"label":"Types a ticket number","kind":"gold"},
      {"id":"b1","lane":1,"col":1,"label":"Ask: exact key or fuzzy?","kind":"box"},
      {"id":"b2","lane":1,"col":2,"label":"Exact. So a scan is never needed","kind":"accent"},
      {"id":"c1","lane":2,"col":1,"label":"Walks all 400,000 rows","kind":"bad"},
      {"id":"c2","lane":2,"col":3,"label":"Jumps to the row directly","kind":"accent"}
    ],
    "edges":[
      {"from":"a1","to":"b1"},
      {"from":"b1","to":"b2","style":"green"},
      {"from":"b2","to":"c2","style":"green","label":"add an index"}
    ],
    "caption":"Nothing in the code changed, and that was the clue. The code was always a linear scan. Last year the pile was small enough to hide it."
  }'></div>

  <p><strong>The answer.</strong> The lookup is by an exact, unique key, so this was never a search problem at all, it was a missing index. Add one on the ticket number and each lookup becomes a handful of jumps instead of 400,000 comparisons. The four seconds becomes a few milliseconds, and it stays that way at four million tickets.</p>

  <div class="callout good">
    <div class="ch">Why this reasoning wins</div>
    <p>It never guessed at an algorithm. It asked one question, <em class="k">exact key or not</em>, and that single answer eliminated every method except two. Speed came from removing options, not from adding cleverness.</p>
  </div>

  <h2><span class="ix">10</span> Your Turn</h2>
  <div class="callout accent">
    <div class="ch">Your rep, no code</div>
    <p>Open your phone and pick three things you searched this week: a contact, a message inside a chat, and a place on a map. For each one write two lines. First, <strong>what order already existed</strong> before you searched. Second, <strong>who paid for that order, and when</strong>. If you cannot name who paid, you have found the linear scan.</p>
  </div>

  <h2><span class="ix gold">✓</span> Check Yourself</h2>

  <div class="quiz" data-correct="1">
    <div class="q">A list of 1,000 names is unsorted. You will search it exactly once, for one name. What should you do?</div>
    <div class="opt" data-i="0">Sort it first, then binary search it</div>
    <div class="opt" data-i="1">Just scan it once, straight through</div>
    <div class="opt" data-i="2">Build a hash table, then look it up</div>
    <div class="qexp">Sorting costs far more than the single scan you were going to do anyway. Order only pays off when you will search many times. One search, no order, means scan and move on.</div>
  </div>

  <div class="quiz" data-correct="2">
    <div class="q">A page loads in 0.2 seconds with 1,000 rows and 20 seconds with 100,000 rows. What does that shape tell you?</div>
    <div class="opt" data-i="0">The server is under-powered</div>
    <div class="opt" data-i="1">The network got slower</div>
    <div class="opt" data-i="2">The work grows in step with the data, so something is scanning everything</div>
    <div class="qexp">100 times the data produced roughly 100 times the wait. That straight-line relationship is the fingerprint of a linear scan. Hardware and network problems do not scale so neatly with row count.</div>
  </div>

  <div class="callout good">
    <div class="ch">Next</div>
    <p>You now have the one question. Next we go inside the honest, patient method that needs no order at all, and find out exactly where it stops being acceptable.</p>
  </div>

  }
  if (b.x + b.w <= a.x) {                                   /* leftward */
    const ay = a.y + a.h/2, by = b.y + b.h/2;
    const mx = a.x - (gy/2);
    return 'M' + a.x + ',' + ay + ' L' + mx + ',' + ay + ' L' + mx + ',' + by + ' L' + (b.x+b.w) + ',' + by;
  }
  const my2 = b.y + b.h + (gy/2);                           /* upward */
  return 'M' + ax + ',' + a.y + ' L' + ax + ',' + (my2) + ' L' + bx + ',' + my2 + ' L' + bx + ',' + (b.y+b.h);
}

function rectsHit(a, b){
  return a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;
}

/* ============================ LAYOUT ENGINES ============================ */
const GAP = { gx:56, gy:46, padX:15, padY:12, minW:104, minH:44 };

/* layered: nodes carry col and row on an integer grid. No two nodes may share a cell,
   so overlap is impossible by construction. Column widths and row heights are the max
   of their members, and every node is centred in its cell. */
function layoutLayered(nodes, opt){
  opt = opt || {};
  const gx = opt.gx || GAP.gx, gy = opt.gy || GAP.gy;
  const seen = {};
  nodes.forEach(function(n){
    const key = n.col + ':' + n.row;
    if (seen[key]) throw new Error('grid collision at col ' + n.col + ' row ' + n.row);
    seen[key] = 1;
    const m = measure(n.label, n.maxChars || opt.maxChars || 20, n.fs || 12.5);
    n.lines = m.lines;
    n.w = Math.max(opt.minW || GAP.minW, m.w + GAP.padX*2);
    n.h = Math.max(GAP.minH, m.h + GAP.padY*2);
    if (n.shape === 'diamond'){ n.w = Math.round(n.w * 1.42); n.h = Math.round(n.h * 1.55); }
  });
  const cols = {}, rows = {};
  nodes.forEach(function(n){
    cols[n.col] = Math.max(cols[n.col] || 0, n.w);
    rows[n.row] = Math.max(rows[n.row] || 0, n.h);
  });
  const colKeys = Object.keys(cols).map(Number).sort(function(a,b){return a-b;});
  const rowKeys = Object.keys(rows).map(Number).sort(function(a,b){return a-b;});
  const colX = {}, rowY = {};
  let x = 0; colKeys.forEach(function(c){ colX[c] = x; x += cols[c] + gx; });
  let y = 0; rowKeys.forEach(function(r){ rowY[r] = y; y += rows[r] + gy; });
  nodes.forEach(function(n){
    n.x = colX[n.col] + (cols[n.col] - n.w)/2;
    n.y = rowY[n.row] + (rows[n.row] - n.h)/2;
  });
  return { w: Math.max(0, x - gx), h: Math.max(0, y - gy), gy: gy };
}

/* browser-side safety net. Never fires when the grid contract is respected. */
function assertNoOverlap(nodes, where){
  for (let i=0;i<nodes.length;i++) for (let j=i+1;j<nodes.length;j++){
    const a = nodes[i], b = nodes[j];
    if (a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h){
      console.warn('[viz] overlap in ' + where + ':', a.label, '<->', b.label);
      return false;
    }
  }
  return true;
}

/* ============================ VIZ RENDERERS ============================ */
const PAD = 14;

function frame(inner, w, h){
  return svgOpen(w + PAD*2, h + PAD*2) + '<g transform="translate(' + PAD + ',' + PAD + ')">' + inner + '</g></svg>';
}
/* like frame, but the canvas grows to swallow anything that spilled outside the authored box */
function frameFit(inner, boxes, w, h){
  let minX = 0, minY = 0, maxX = w, maxY = h;
  boxes.forEach(function(b){
    minX = Math.min(minX, b.x); minY = Math.min(minY, b.y);
    maxX = Math.max(maxX, b.x + b.w); maxY = Math.max(maxY, b.y + b.h);
  });
  return svgOpen(maxX - minX + PAD*2, maxY - minY + PAD*2) +
    '<g transform="translate(' + (PAD - minX) + ',' + (PAD - minY) + ')">' + inner + '</g></svg>';
}
function pathMid(d){
  const pts = (d.match(/[ML]([\d.-]+),([\d.-]+)/g) || []).map(function(t){
    const p = t.slice(1).split(','); return [parseFloat(p[0]), parseFloat(p[1])];
  });
  if (pts.length < 2) return null;
  let total = 0; const seg = [];
  for (let i = 1; i < pts.length; i++){
    const l = Math.hypot(pts[i][0] - pts[i-1][0], pts[i][1] - pts[i-1][1]);
    seg.push(l); total += l;
  }
  let want = total / 2;
  for (let i = 0; i < seg.length; i++){
    if (want <= seg[i] || i === seg.length - 1){
      const t = seg[i] ? want / seg[i] : 0;
      return [pts[i][0] + (pts[i+1][0] - pts[i][0]) * t, pts[i][1] + (pts[i+1][1] - pts[i][1]) * t];
    }
    want -= seg[i];
  }
  return null;
}
function edgeSvg(d, label, style, gy, sink){
  const gold = style === 'gold', green = style === 'green', dash = style === 'dashed';
  const col = gold ? CLR.gold6 : green ? CLR.g600 : CLR.lineS;
  const mk  = gold ? 'ahy' : green ? 'ahg' : 'ah';
  let out = '<path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="1.5" ' +
    (dash ? 'stroke-dasharray="5 4" ' : '') + 'marker-end="url(#' + mk + ')"/>';
  if (label){
    const p = pathMid(d);
    if (p){
      if (sink) sink.push([p[0], p[1], label, col]);
      else out += chip(p[0], p[1], label, 10, col, 600);
    }
  }
  return out;
}

/* ---- layered family: flowchart, decision tree, state, user flow, architecture, component, IA ---- */
function renderLayered(spec, preset){
  const nodes = (spec.nodes || []).map(function(n){
    return Object.assign({}, n, { shape: n.shape || preset.shape || 'box', kind: n.kind || preset.kind || 'box' });
  });
  const edges = spec.edges || [];
  const widest = edges.reduce(function(m, e){
    return Math.max(m, e.label ? String(e.label).length * charW(10) + 22 : 0);
  }, 0);
  const gx = Math.max(spec.gx || preset.gx || GAP.gx, widest);
  const box = layoutLayered(nodes, { gx: gx, gy: spec.gy || preset.gy, maxChars: spec.maxChars });
  assertNoOverlap(nodes, spec.title || preset.name);
  const by = {}; nodes.forEach(function(n){ by[n.id] = n; });
  const addr = !!preset.addressable;
  const elabels = [];
  let out = '';
  edges.forEach(function(e){
    const a = by[e.from], b = by[e.to];
    if (!a || !b) return;
    const sink = [];
    const path = edgeSvg(route(a, b, box.gy), e.label, e.style, box.gy, sink);
    sink.forEach(function(l){ elabels.push([l[0], l[1], l[2], l[3], e.from + '-' + e.to]); });
    out += addr ? '<g class="ge" data-e="' + e.from + '-' + e.to + '" opacity="1">' + path + '</g>' : path;
  });
  nodes.forEach(function(n){
    out += addr ? '<g class="cell" data-i="' + n.id + '" opacity="1">' + nodeSvg(n) + '</g>' : nodeSvg(n);
  });
  /* Two edges running between the same pair of nodes share a midpoint, so their labels would
     print on top of each other. Each label takes the first offset that collides with nothing
     already placed, counting the nodes themselves as obstacles. */
  const occupied = nodes.map(function(n){ return { x:n.x, y:n.y, w:n.w, h:n.h }; });
  const OFFSETS = [0, 17, -17, 34, -34, 51, -51];
  elabels.forEach(function(l){
    const lw = String(l[2]).length * charW(10) + 12, lh = 18;
    let y = l[1];
    for (const dy of OFFSETS){
      const r = { x: l[0] - lw/2, y: l[1] + dy - lh/2, w: lw, h: lh };
      if (!occupied.some(function(o){ return rectsHit(r, o); })){ y = l[1] + dy; break; }
    }
    occupied.push({ x: l[0] - lw/2, y: y - lh/2, w: lw, h: lh });
    const c = chip(l[0], y, l[2], 10, l[3], 600);
    out += addr ? '<g class="ge" data-e="' + l[4] + '" opacity="1">' + c + '</g>' : c;
  });
  (spec.groups || []).forEach(function(g){
    const mem = g.nodes.map(function(id){ return by[id]; }).filter(Boolean);
    if (!mem.length) return;
    const x1 = Math.min.apply(null, mem.map(function(n){return n.x;})) - 14;
    const y1 = Math.min.apply(null, mem.map(function(n){return n.y;})) - 26;
    const x2 = Math.max.apply(null, mem.map(function(n){return n.x + n.w;})) + 14;
    const y2 = Math.max.apply(null, mem.map(function(n){return n.y + n.h;})) + 14;
    out = '<g><rect x="' + x1 + '" y="' + y1 + '" width="' + (x2-x1) + '" height="' + (y2-y1) + '" rx="13" fill="none" ' +
          'stroke="' + CLR.line + '" stroke-width="1.2" stroke-dasharray="6 5"/>' +
          labelAt(x1 + 12, y1 + 12, g.label, 10, CLR.mute, 'start', 700) + '</g>' + out;
  });
  return frame(out, box.w, box.h);
}

/* ---- sequence diagram ---- */
function renderSeq(spec){
  const actors = spec.actors || [];
  const msgs = spec.messages || [];
  const colW = 168, headH = 46, top = headH + 26, stepH = 46;
  const w = Math.max(colW * actors.length, 420);
  const h = top + msgs.length * stepH + 20;
  const cx = actors.map(function(_, i){ return i * colW + colW/2; });
  let out = '';
  actors.forEach(function(a, i){
    const m = measure(a.label || a, 18, 12);
    const bw = Math.max(120, m.w + 26), bx = cx[i] - bw/2;
    const k = KIND[(a.kind) || 'accent'];
    out += '<rect x="' + bx + '" y="0" width="' + bw + '" height="' + headH + '" rx="10" fill="' + k.fill + '" stroke="' + k.stroke + '" stroke-width="1.4"/>' +
           tspans(m.lines, cx[i], headH/2, 12, k.text, 700) +
           '<line x1="' + cx[i] + '" y1="' + headH + '" x2="' + cx[i] + '" y2="' + (h - 12) + '" stroke="' + CLR.line + '" stroke-width="1.2" stroke-dasharray="4 5"/>';
  });
  msgs.forEach(function(mg, i){
    const y = top + i * stepH;
    const a = cx[mg.from], b = cx[mg.to];
    const col = mg.style === 'gold' ? CLR.gold6 : mg.style === 'green' ? CLR.g600 : CLR.lineS;
    const mk  = mg.style === 'gold' ? 'ahy' : mg.style === 'green' ? 'ahg' : 'ah';
    if (a === b){
      out += '<path d="M' + a + ',' + y + ' h34 v22 h-34" fill="none" stroke="' + col + '" stroke-width="1.5" marker-end="url(#' + mk + ')"/>' +
             labelAt(a + 44, y + 11, mg.label, 10.5, CLR.soft, 'start', 600);
    } else {
      out += '<line x1="' + a + '" y1="' + y + '" x2="' + b + '" y2="' + y + '" stroke="' + col + '" stroke-width="1.5" ' +
             (mg.style === 'dashed' ? 'stroke-dasharray="5 4" ' : '') + 'marker-end="url(#' + mk + ')"/>';
      const mx = (a + b)/2, lw = String(mg.label || '').length * charW(10.5) + 12;
      out += '<rect x="' + (mx - lw/2) + '" y="' + (y - 19) + '" width="' + lw + '" height="17" rx="5" fill="#ffffff"/>' +
             labelAt(mx, y - 11, mg.label, 10.5, CLR.soft, 'middle', 600);
    }
    out += labelAt(-6, y, String(i+1), 9.5, CLR.mute, 'end', 700);
  });
  return frame(out, w, h);
}

/* ---- swimlane ---- */
function renderSwim(spec){
  const lanes = spec.lanes || [], steps = spec.steps || [];
  const laneW = 132, colW = 176, laneH = 78;
  const ncol = Math.max.apply(null, steps.map(function(s){ return s.col; }).concat([0])) + 1;
  const w = laneW + ncol * colW, h = lanes.length * laneH;
  let out = '';
  lanes.forEach(function(l, i){
    const y = i * laneH;
    out += '<rect x="0" y="' + y + '" width="' + w + '" height="' + laneH + '" fill="' + (i % 2 ? CLR.grey0 : '#ffffff') + '"/>' +
           '<rect x="0" y="' + y + '" width="' + laneW + '" height="' + laneH + '" fill="' + CLR.g050 + '"/>' +
           '<line x1="0" y1="' + y + '" x2="' + w + '" y2="' + y + '" stroke="' + CLR.line + '" stroke-width="1"/>';
    const m = measure(l.label || l, 15, 12);
    out += tspans(m.lines, laneW/2, y + laneH/2, 12, CLR.g700, 700);
  });
  out += '<line x1="0" y1="' + h + '" x2="' + w + '" y2="' + h + '" stroke="' + CLR.line + '" stroke-width="1"/>' +
         '<line x1="' + laneW + '" y1="0" x2="' + laneW + '" y2="' + h + '" stroke="' + CLR.lineS + '" stroke-width="1.2"/>';
  const pos = {};
  steps.forEach(function(s){
    const m = measure(s.label, 18, 11.5);
    const bw = Math.min(colW - 26, Math.max(112, m.w + 22)), bh = Math.max(38, m.h + 18);
    const x = laneW + s.col * colW + (colW - bw)/2, y = s.lane * laneH + (laneH - bh)/2;
    pos[s.id != null ? s.id : (s.lane + '-' + s.col)] = { x:x, y:y, w:bw, h:bh };
    const k = KIND[s.kind || 'box'];
    out += '<rect x="' + x + '" y="' + y + '" width="' + bw + '" height="' + bh + '" rx="9" fill="' + k.fill + '" stroke="' + k.stroke + '" stroke-width="1.4"/>' +
           tspans(m.lines, x + bw/2, y + bh/2, 11.5, k.text, 600);
  });
  (spec.edges || []).forEach(function(e){
    const a = pos[e.from], b = pos[e.to];
    if (a && b) out = out + edgeSvg(route(a, b, 34), e.label, e.style, 34);
  });
  return frame(out, w, h);
}

/* ---- journey map ---- */
function renderJourney(spec){
  const st = spec.stages || [];
  const colW = 172, rowLabelW = 108, rows = ['Stage','Doing','Thinking'];
  const rowH = 62, feelH = 92;
  const w = rowLabelW + st.length * colW, h = rows.length * rowH + feelH + 26;
  let out = '';
  rows.forEach(function(r, i){
    const y = i * rowH;
    out += '<rect x="0" y="' + y + '" width="' + w + '" height="' + rowH + '" fill="' + (i === 0 ? CLR.g050 : (i % 2 ? '#ffffff' : CLR.grey0)) + '"/>' +
           '<line x1="0" y1="' + y + '" x2="' + w + '" y2="' + y + '" stroke="' + CLR.line + '"/>' +
           labelAt(12, y + rowH/2, r, 10, CLR.mute, 'start', 700);
  });
  st.forEach(function(s, i){
    const x = rowLabelW + i * colW;
    out += '<line x1="' + x + '" y1="0" x2="' + x + '" y2="' + (rows.length*rowH) + '" stroke="' + CLR.line + '"/>';
    [s.stage, s.doing, s.thinking].forEach(function(txt, r){
      const m = measure(txt || '', 20, r === 0 ? 12.5 : 11);
      out += tspans(m.lines, x + colW/2, r*rowH + rowH/2, r === 0 ? 12.5 : 11, r === 0 ? CLR.g700 : CLR.soft, r === 0 ? 700 : 500);
    });
  });
  const fy = rows.length * rowH + 14;
  out += '<rect x="0" y="' + fy + '" width="' + w + '" height="' + feelH + '" fill="#ffffff"/>' +
         labelAt(12, fy + feelH/2, 'Feeling', 10, CLR.mute, 'start', 700);
  const pts = st.map(function(s, i){
    const v = Math.max(1, Math.min(5, s.feeling || 3));
    return [rowLabelW + i*colW + colW/2, fy + feelH - ((v-1)/4) * (feelH - 26) - 13];
  });
  out += '<polyline points="' + pts.map(function(p){return p[0]+','+p[1];}).join(' ') + '" fill="none" stroke="' + CLR.gold + '" stroke-width="2.4" stroke-linejoin="round"/>';
  pts.forEach(function(p, i){
    const v = st[i].feeling || 3;
    const c = v >= 4 ? CLR.g600 : v <= 2 ? CLR.bad : CLR.gold6;
    out += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="6" fill="#ffffff" stroke="' + c + '" stroke-width="2.4"/>';
  });
  return frame(out, w, h);
}

/* ---- network and knowledge graph: authored coordinates on a unit grid ---- */
function renderNet(spec){
  const unit = spec.unit || 118;
  const nodes = (spec.nodes || []).map(function(n){
    const m = measure(n.label, n.maxChars || 16, 11.5);
    const r = Math.max(30, m.w/2 + 13);
    return Object.assign({}, n, { lines:m.lines, cx:n.x*unit, cy:n.y*unit, r:r, kind:n.kind || 'box' });
  });
  const minX = Math.min.apply(null, nodes.map(function(n){return n.cx - n.r;}));
  const minY = Math.min.apply(null, nodes.map(function(n){return n.cy - n.r - 4;}));
  nodes.forEach(function(n){ n.cx -= minX; n.cy -= minY; });
  const maxX = Math.max.apply(null, nodes.map(function(n){return n.cx + n.r;}));
  const maxY = Math.max.apply(null, nodes.map(function(n){return n.cy + n.r;}));
  const by = {}; nodes.forEach(function(n){ by[n.id] = n; });
  let out = '';
  (spec.edges || []).forEach(function(e){
    const a = by[e.from], b = by[e.to];
    if (!a || !b) return;
    const dx = b.cx-a.cx, dy = b.cy-a.cy, d = Math.sqrt(dx*dx+dy*dy) || 1;
    const x1 = a.cx + dx/d*a.r, y1 = a.cy + dy/d*a.r, x2 = b.cx - dx/d*(b.r+7), y2 = b.cy - dy/d*(b.r+7);
    const col = e.style === 'gold' ? CLR.gold6 : e.style === 'green' ? CLR.g600 : CLR.lineS;
    const mk  = e.style === 'gold' ? 'ahy' : e.style === 'green' ? 'ahg' : 'ah';
    out += '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' + col + '" stroke-width="1.5" ' +
           (e.dashed ? 'stroke-dasharray="5 4" ' : '') + (e.arrow === false ? '' : 'marker-end="url(#' + mk + ')"');
    out += '/>';
    if (e.label){
      const mx = (x1+x2)/2, my = (y1+y2)/2, lw = String(e.label).length * charW(10) + 10;
      out += '<rect x="' + (mx-lw/2) + '" y="' + (my-9) + '" width="' + lw + '" height="18" rx="5" fill="#ffffff" opacity="0.95"/>' +
             labelAt(mx, my, e.label, 10, col, 'middle', 600);
    }
  });
  nodes.forEach(function(n){
    const k = KIND[n.kind];
    out += '<circle cx="' + n.cx + '" cy="' + n.cy + '" r="' + n.r + '" fill="' + k.fill + '" stroke="' + k.stroke + '" stroke-width="1.6"/>' +
           tspans(n.lines, n.cx, n.cy, 11.5, k.text, 600);
  });
  return frame(out, maxX, maxY);
}

/* ---- entity relationship diagram ---- */
function renderErd(spec){
  const ents = spec.entities || [];
  const colW = 236, rowGap = 40, headH = 38, fieldH = 25;
  const placed = ents.map(function(e){
    const h = headH + (e.fields || []).length * fieldH;
    return Object.assign({}, e, { w:200, h:h });
  });
  const cols = {}, rows = {};
  placed.forEach(function(e){ cols[e.col] = 1; rows[e.row] = Math.max(rows[e.row]||0, e.h); });
  const rowKeys = Object.keys(rows).map(Number).sort(function(a,b){return a-b;});
  const rowY = {}; let y = 0;
  rowKeys.forEach(function(r){ rowY[r] = y; y += rows[r] + rowGap; });
  placed.forEach(function(e){ e.x = e.col * colW; e.y = rowY[e.row]; });
  const w = Math.max.apply(null, placed.map(function(e){return e.x + e.w;}));
  const h = Math.max(0, y - rowGap);
  const by = {}; placed.forEach(function(e){ by[e.name] = e; });
  let out = '';
  (spec.rels || []).forEach(function(r){
    const a = by[r.from], b = by[r.to];
    if (a && b) out += edgeSvg(route(a, b, rowGap), r.label, 'green', rowGap);
  });
  placed.forEach(function(e){
    out += '<rect x="' + e.x + '" y="' + e.y + '" width="' + e.w + '" height="' + e.h + '" rx="10" fill="#ffffff" stroke="' + CLR.lineS + '" stroke-width="1.4"/>' +
           '<path d="M' + e.x + ',' + (e.y+10) + ' a10,10 0 0 1 10,-10 h180 a10,10 0 0 1 10,10 v' + (headH-10) + ' h-200 Z" fill="' + CLR.g700 + '"/>' +
           labelAt(e.x + e.w/2, e.y + headH/2, e.name, 12.5, '#ffffff', 'middle', 700);
    (e.fields || []).forEach(function(f, i){
      const fy = e.y + headH + i*fieldH;
      out += '<line x1="' + e.x + '" y1="' + fy + '" x2="' + (e.x+e.w) + '" y2="' + fy + '" stroke="' + CLR.line + '"/>' +
             labelAt(e.x + 12, fy + fieldH/2, f.name, 11, f.key ? CLR.gold6 : CLR.soft, 'start', f.key ? 700 : 500) +
             labelAt(e.x + e.w - 12, fy + fieldH/2, f.type || '', 10, CLR.mute, 'end', 500);
    });
  });
  return frame(out, w, h);
}

/* ---- screen wireframe ---- */
function renderWire(spec){
  const w = spec.width || 520, colU = w/12;
  const blocks = spec.blocks || [];
  const h = Math.max.apply(null, blocks.map(function(b){ return (b.y + b.h) * 26; })) + 62;
  let out = '<rect x="0" y="0" width="' + w + '" height="' + h + '" rx="14" fill="#ffffff" stroke="' + CLR.lineS + '" stroke-width="1.6"/>' +
            '<rect x="0" y="0" width="' + w + '" height="34" rx="14" fill="' + CLR.grey0 + '"/>' +
            '<rect x="0" y="24" width="' + w + '" height="10" fill="' + CLR.grey0 + '"/>' +
            '<line x1="0" y1="34" x2="' + w + '" y2="34" stroke="' + CLR.line + '"/>';
  ['#e06c5f','#e8bb50','#6fbf73'].forEach(function(c, i){ out += '<circle cx="' + (18 + i*15) + '" cy="17" r="4.6" fill="' + c + '"/>'; });
  if (spec.screen) out += labelAt(w/2, 17, spec.screen, 10.5, CLR.mute, 'middle', 600);
  blocks.forEach(function(b){
    const x = b.x * colU + 14, y = b.y * 26 + 48, bw = b.w * colU - 12, bh = b.h * 26 - 10;
    const k = KIND[b.kind || 'muted'];
    out += '<rect x="' + x + '" y="' + y + '" width="' + bw + '" height="' + bh + '" rx="8" fill="' + k.fill + '" stroke="' + k.stroke + '" stroke-width="1.3" ' +
           (b.dashed ? 'stroke-dasharray="5 4"' : '') + '/>';
    if (b.label){
      const m = measure(b.label, Math.max(8, Math.floor(bw / charW(11.5))), 11.5);
      out += tspans(m.lines, x + bw/2, y + bh/2, 11.5, k.text, 600);
    }
  });
  return frame(out, w, h);
}

/* ---- growth curves ---- */
function renderCurve(spec){
  const w = spec.width || 520, h = spec.height || 250, ml = 46, mb = 34, mt = 14, mr = 96;
  const px = w - ml - mr, py = h - mt - mb;
  const N = spec.n || 32;
  const FN = {
    '1':     function(){ return 1; },
    'logn':  function(n){ return Math.log2(n + 1); },
    'sqrtn': function(n){ return Math.sqrt(n); },
    'n':     function(n){ return n; },
    'nlogn': function(n){ return n * Math.log2(n + 1); },
    'n2':    function(n){ return n * n; },
    'n3':    function(n){ return n * n * n; },
    '2n':    function(n){ return Math.pow(2, Math.min(n, 60)); },
    'nfact': function(n){ let v = 1; for (let k = 2; k <= Math.min(n, 20); k++) v *= k; return v; }
  };
  const series = (spec.series || []).map(function(s){
    const f = FN[s.fn] || FN.n;
    const pts = []; for (let i = 1; i <= N; i++) pts.push([i, f(i)]);
    return { label:s.label, color:s.color === 'gold' ? CLR.gold : s.color === 'bad' ? CLR.bad : s.color === 'green' ? CLR.g600 : CLR.grey, pts:pts };
  });
  const maxY = spec.maxY || Math.max.apply(null, series.map(function(s){ return s.pts[s.pts.length-1][1]; }));
  const LOG = !!spec.logScale;
  const frac = function(v){ return LOG ? Math.log10(Math.max(1, v)) / Math.log10(Math.max(10, maxY))
                                       : Math.min(1, v / maxY); };
  let out = '<line x1="' + ml + '" y1="' + mt + '" x2="' + ml + '" y2="' + (mt+py) + '" stroke="' + CLR.lineS + '" stroke-width="1.2"/>' +
            '<line x1="' + ml + '" y1="' + (mt+py) + '" x2="' + (ml+px) + '" y2="' + (mt+py) + '" stroke="' + CLR.lineS + '" stroke-width="1.2"/>' +
            labelAt(ml + px/2, mt + py + 22, spec.xlabel || 'how much data', 11, CLR.mute, 'middle', 600) +
            '<g transform="translate(14,' + (mt + py/2) + ') rotate(-90)">' +
              labelAt(0, 0, (spec.ylabel || 'steps of work') + (LOG ? ', log scale' : ''), 11, CLR.mute, 'middle', 600) + '</g>';
  series.forEach(function(s){
    const d = s.pts.map(function(p, i){
      const x = ml + (p[0]/N) * px, y = mt + py - Math.min(1, p[1]/maxY) * py;
      return (i ? 'L' : 'M') + x.toFixed(1) + ',' + y.toFixed(1);
    }).join(' ');
    out += '<path d="' + d + '" fill="none" stroke="' + s.color + '" stroke-width="2.4" stroke-linecap="round"/>';
    const last = s.pts[s.pts.length-1];
    const ly = mt + py - Math.min(1, last[1]/maxY) * py;
    out += labelAt(ml + px + 9, Math.max(mt + 6, ly), s.label, 11, s.color, 'start', 700);
  });
  return frame(out, w, h);
}

/* ---- real-life scene: a tiny illustration primitive set ---- */
/* --- collision helpers --- */
function segHitsRect(x1, y1, x2, y2, r){
  if (Math.max(x1,x2) < r.x || Math.min(x1,x2) > r.x + r.w) return false;
  if (Math.max(y1,y2) < r.y || Math.min(y1,y2) > r.y + r.h) return false;
  const steps = 24;
  for (let i = 0; i <= steps; i++){
    const t = i/steps, px = x1 + (x2-x1)*t, py = y1 + (y2-y1)*t;
    if (px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h) return true;
  }
  return false;
}
function iconBox(it){
  const s = it.scale || 1.3;
  const W = { person:44, doc:40, server:52, phone:38, glass:52, shelf:88, pile:70 }[it.icon] || 110;
  const H = { person:60, doc:60, server:56, phone:60, glass:48, shelf:60, pile:44 }[it.icon] || 46;
  return { x: it.x - (W*s)/2, y: it.y - (H*s)/2, w: W*s, h: H*s };
}
function sceneIcon(it){
  const x = it.x, y = it.y, k = KIND[it.kind || 'box'], s = it.scale || 1.3;
  const cap = '';
  if (it.icon === 'person'){
    return '<g><circle cx="' + x + '" cy="' + (y-14*s) + '" r="' + (10*s) + '" fill="' + k.fill + '" stroke="' + k.stroke + '" stroke-width="1.6"/>' +
      '<path d="M' + (x-15*s) + ',' + (y+18*s) + ' a' + (15*s) + ',' + (17*s) + ' 0 0 1 ' + (30*s) + ',0 Z" fill="' + k.fill + '" stroke="' + k.stroke + '" stroke-width="1.6"/></g>' + cap;
  }
  if (it.icon === 'doc'){
    return '<g><path d="M' + (x-13*s) + ',' + (y-20*s) + ' h' + (18*s) + ' l' + (8*s) + ',' + (8*s) + ' v' + (32*s) + ' h' + (-26*s) + ' Z" fill="' + k.fill + '" stroke="' + k.stroke + '" stroke-width="1.5"/>' +
      '<path d="M' + (x-7*s) + ',' + (y-4*s) + ' h' + (14*s) + ' M' + (x-7*s) + ',' + (y+4*s) + ' h' + (14*s) + '" stroke="' + k.stroke + '" stroke-width="1.2"/></g>' + cap;
  }
  if (it.icon === 'server'){
    return '<g>' + [0,1,2].map(function(i){
      return '<rect x="' + (x-19*s) + '" y="' + (y-22*s + i*15*s) + '" width="' + (38*s) + '" height="' + (12*s) + '" rx="3" fill="' + k.fill + '" stroke="' + k.stroke + '" stroke-width="1.4"/>' +
             '<circle cx="' + (x-12*s) + '" cy="' + (y-16*s + i*15*s) + '" r="2" fill="' + CLR.g500 + '"/>';
    }).join('') + '</g>' + cap;
  }
  if (it.icon === 'phone'){
    return '<g><rect x="' + (x-14*s) + '" y="' + (y-26*s) + '" width="' + (28*s) + '" height="' + (50*s) + '" rx="6" fill="' + k.fill + '" stroke="' + k.stroke + '" stroke-width="1.6"/>' +
      '<rect x="' + (x-9*s) + '" y="' + (y-19*s) + '" width="' + (18*s) + '" height="' + (30*s) + '" rx="2" fill="' + CLR.grey0 + '"/></g>' + cap;
  }
  if (it.icon === 'glass'){
    return '<g><circle cx="' + x + '" cy="' + (y-6*s) + '" r="' + (14*s) + '" fill="none" stroke="' + k.stroke + '" stroke-width="2.4"/>' +
      '<line x1="' + (x+10*s) + '" y1="' + (y+4*s) + '" x2="' + (x+22*s) + '" y2="' + (y+16*s) + '" stroke="' + k.stroke + '" stroke-width="2.8" stroke-linecap="round"/></g>' + cap;
  }
  if (it.icon === 'shelf'){
    return '<g>' + [0,1].map(function(r){ return [0,1,2,3].map(function(c){
      return '<rect x="' + (x-34*s + c*18*s) + '" y="' + (y-22*s + r*22*s) + '" width="' + (13*s) + '" height="' + (18*s) + '" rx="2" fill="' + k.fill + '" stroke="' + k.stroke + '" stroke-width="1.2"/>';
    }).join(''); }).join('') +
      '<line x1="' + (x-38*s) + '" y1="' + (y-2*s) + '" x2="' + (x+38*s) + '" y2="' + (y-2*s) + '" stroke="' + CLR.lineS + '" stroke-width="2"/>' +
      '<line x1="' + (x-38*s) + '" y1="' + (y+22*s) + '" x2="' + (x+38*s) + '" y2="' + (y+22*s) + '" stroke="' + CLR.lineS + '" stroke-width="2"/></g>' + cap;
  }
  if (it.icon === 'pile'){
    return '<g>' + [0,1,2,3,4,5].map(function(i){
      const ox = ((i*37) % 44) - 22, oy = ((i*53) % 26) - 13;
      return '<rect x="' + (x+ox*s) + '" y="' + (y+oy*s) + '" width="' + (15*s) + '" height="' + (12*s) + '" rx="2" fill="' + k.fill + '" stroke="' + k.stroke + '" stroke-width="1.2" transform="rotate(' + ((i*29)%40 - 20) + ' ' + (x+ox*s) + ' ' + (y+oy*s) + ')"/>';
    }).join('') + '</g>' + cap;
  }
  const m = measure(it.label || '', 16, 11.5);
  const bw = Math.max(96, m.w + 24), bh = Math.max(38, m.h + 18);
  return '<g><rect x="' + (x-bw/2) + '" y="' + (y-bh/2) + '" width="' + bw + '" height="' + bh + '" rx="9" fill="' + k.fill + '" stroke="' + k.stroke + '" stroke-width="1.4"/>' +
    tspans(m.lines, x, y, 11.5, k.text, 600) + '</g>';
}
function renderScene(spec){
  const items = spec.items || [];
  const w = spec.width || 560, h = spec.height || 220;
  const arrows = spec.arrows || [];
  let lines = '', labels = '';
  arrows.forEach(function(a){
    const col = a.style === 'gold' ? CLR.gold6 : a.style === 'green' ? CLR.g600 : CLR.lineS;
    const mk  = a.style === 'gold' ? 'ahy' : a.style === 'green' ? 'ahg' : 'ah';
    lines += '<line x1="' + a.x1 + '" y1="' + a.y1 + '" x2="' + a.x2 + '" y2="' + a.y2 + '" stroke="' + col + '" stroke-width="1.8" ' +
             (a.dashed ? 'stroke-dasharray="5 4" ' : '') + 'marker-end="url(#' + mk + ')"/>';
    if (a.label){
      const dx = a.x2-a.x1, dy = a.y2-a.y1, L = Math.hypot(dx,dy) || 1;
      const off = a.off == null ? 20 : a.off;
      labels += chip((a.x1+a.x2)/2 - (dy/L)*off, (a.y1+a.y2)/2 + (dx/L)*off, a.label, 10.5, col, 700);
    }
  });
  /* draw order matters: connective lines first, then the objects, then every label on top,
     so a caption can never end up underneath the line it is describing */
  const body = items.map(sceneIcon).join('');

  /* every caption is placed against everything already on the board: the icons, the arrow
     chips, the arrow lines themselves, and the captions placed before it. The first
     candidate slot that collides with nothing wins, so a scene cannot render on top of itself. */
  const taken = items.map(iconBox);
  arrows.forEach(function(a){
    if (!a.label) return;
    const dx = a.x2-a.x1, dy = a.y2-a.y1, L = Math.hypot(dx,dy) || 1;
    const off = a.off == null ? 20 : a.off;
    const cw = String(a.label).length * charW(10.5) + 12;
    taken.push({ x:(a.x1+a.x2)/2 - (dy/L)*off - cw/2, y:(a.y1+a.y2)/2 + (dx/L)*off - 9, w:cw, h:18 });
  });
  let caps = '';
  items.forEach(function(it){
    if (!it.label) return;
    const sc = it.scale || 1.3, ib = iconBox(it);
    const cw = String(it.label).length * charW(11) + 14, chh = 20;
    const slots = [ ib.y + ib.h + 16, ib.y - 16 - chh, ib.y + ib.h + 40, ib.y - 40 - chh ];
    let cy = slots[0];
    for (const cand of slots){
      const r = { x: it.x - cw/2, y: cand, w: cw, h: chh };
      const hitsBox = taken.some(function(t){ return rectsHit(r, t); });
      const hitsLine = arrows.some(function(a){ return segHitsRect(a.x1, a.y1, a.x2, a.y2, r); });
      if (!hitsBox && !hitsLine){ cy = cand; break; }
    }
    taken.push({ x: it.x - cw/2, y: cy, w: cw, h: chh });
    caps += chip(it.x, cy + chh/2, it.label, 11, CLR.soft, 600);
  });
  arrows.forEach(function(a){
    taken.push({ x:Math.min(a.x1,a.x2), y:Math.min(a.y1,a.y2), w:Math.abs(a.x2-a.x1), h:Math.abs(a.y2-a.y1) });
  });
  return frameFit(lines + body + caps + labels, taken, w, h);
}

const VIZ_KIND = {

  seq:'Sequence diagram', swim:'Swimlane diagram', journey:'Journey map', net:'Network diagram',
